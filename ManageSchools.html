<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BodhyaMarg ERP – Manage Schools / Branches</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green: #1a7a4a; --green-light: #e6f4ee; --green-dark: #145e38;
  --bg: #f4f6f8; --white: #ffffff; --border: #e2e6ea;
  --text: #1a1d23; --text-muted: #6b7280; --text-hint: #9ca3af;
  --radius: 8px; --radius-lg: 12px;
}
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; }
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 10px 24px; background: var(--white); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.topbar-search { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 12px; width: 280px; }
.topbar-search i { font-size: 14px; color: var(--text-hint); }
.topbar-search input { border: none; background: transparent; font-size: 12.5px; font-family: inherit; outline: none; width: 100%; }
.topbar-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.icon-btn { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius); border: 1px solid var(--border); background: var(--white); cursor: pointer; color: var(--text-muted); }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--green); color: #fff; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.content { flex: 1; overflow-y: auto; padding: 24px; }
.content::-webkit-scrollbar { width: 4px; }
.content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
.page-header h1 { font-size: 20px; font-weight: 600; }
.breadcrumb { font-size: 11.5px; color: var(--text-hint); margin-top: 3px; display: flex; align-items: center; gap: 4px; }
.breadcrumb span { color: var(--green); }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius); font-size: 12.5px; font-weight: 500; font-family: inherit; cursor: pointer; border: 1px solid var(--border); background: var(--white); color: var(--text); transition: background .12s; white-space: nowrap; }
.btn:hover { background: var(--bg); }
.btn-primary { background: var(--green); color: #fff; border-color: var(--green); }
.btn-primary:hover { background: var(--green-dark); }

/* Stats Cards */
.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; display: flex; align-items: center; gap: 14px; }
.stat-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.stat-icon.green { background: var(--green-light); color: var(--green); }
.stat-icon.blue { background: #dbeafe; color: #2563eb; }
.stat-icon.purple { background: #ede9fe; color: #7c3aed; }
.stat-icon.amber { background: #fef3c7; color: #d97706; }
.stat-val { font-size: 22px; font-weight: 700; }
.stat-label { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }

/* Cards Grid */
.schools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
.school-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; transition: box-shadow .2s; }
.school-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,.06); }
.school-card-header { padding: 20px 20px 14px; display: flex; align-items: flex-start; gap: 14px; }
.school-logo { width: 52px; height: 52px; border-radius: 12px; background: var(--green-light); display: flex; align-items: center; justify-content: center; font-size: 24px; color: var(--green); flex-shrink: 0; }
.school-title { font-size: 15px; font-weight: 600; }
.school-city { font-size: 12px; color: var(--text-muted); margin-top: 3px; display: flex; align-items: center; gap: 4px; }
.school-meta { padding: 0 20px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.meta-item { font-size: 11.5px; }
.meta-label { color: var(--text-hint); }
.meta-val { font-weight: 600; color: var(--text); margin-top: 1px; }
.school-card-footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: #fafbfc; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; }
.badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.badge-active { background: var(--green-light); color: var(--green); }
.badge-active::before { background: var(--green); }
.badge-inactive { background: #fef2f2; color: #dc2626; }
.badge-inactive::before { background: #dc2626; }
.card-actions { display: flex; gap: 6px; }
.card-btn { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--border); background: var(--white); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); font-size: 15px; }
.card-btn:hover { background: var(--bg); }
.card-btn.danger:hover { background: #fef2f2; color: #dc2626; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity .15s; }
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal { background: var(--white); border-radius: var(--radius-lg); width: 520px; max-height: 90vh; overflow-y: auto; padding: 28px; box-shadow: 0 8px 32px rgba(0,0,0,.14); transform: translateY(10px); transition: transform .15s; }
.modal-overlay.open .modal { transform: translateY(0); }
.modal-title { font-size: 15px; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
.modal-title i { color: var(--green); font-size: 18px; }
.modal-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 16px; }
.modal-field label { font-size: 11.5px; font-weight: 500; color: var(--text-muted); }
.modal-field input, .modal-field select, .modal-field textarea {
  font-family: inherit; font-size: 12.5px; color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 9px 10px; background: var(--white); outline: none; transition: border-color .15s;
}
.modal-field input:focus, .modal-field select:focus, .modal-field textarea:focus { border-color: var(--green); }
.modal-field textarea { resize: vertical; min-height: 70px; }
.modal-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
</style>
</head>
<body>

<div id="sidebar-container"></div>

<div class="main">
  <div class="topbar">
    <div class="topbar-search"><i class="ti ti-search"></i><input type="text" placeholder="Search anything…" /></div>
    <div class="topbar-right">
      <div class="icon-btn"><i class="ti ti-bell"></i></div>
      <div class="avatar">S</div>
    </div>
  </div>

  <div class="content">
    <div class="page-header">
      <div>
        <h1>Manage Schools / Branches</h1>
        <div class="breadcrumb">Dashboard <i class="ti ti-chevron-right"></i> Settings <i class="ti ti-chevron-right"></i> <span>Manage Schools</span></div>
      </div>
      <button class="btn btn-primary" onclick="openModal()"><i class="ti ti-circle-plus"></i> Add New Branch</button>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card"><div class="stat-icon green"><i class="ti ti-building"></i></div><div><div class="stat-val" id="statTotal">0</div><div class="stat-label">Total Branches</div></div></div>
      <div class="stat-card"><div class="stat-icon blue"><i class="ti ti-map-pin"></i></div><div><div class="stat-val" id="statCities">0</div><div class="stat-label">Cities Covered</div></div></div>
      <div class="stat-card"><div class="stat-icon purple"><i class="ti ti-users"></i></div><div><div class="stat-val" id="statStudents">0</div><div class="stat-label">Total Students</div></div></div>
      <div class="stat-card"><div class="stat-icon amber"><i class="ti ti-check"></i></div><div><div class="stat-val" id="statActive">0</div><div class="stat-label">Active Branches</div></div></div>
    </div>

    <!-- Schools Grid -->
    <div class="schools-grid" id="schoolsGrid"></div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <div class="modal-title"><i class="ti ti-building"></i> <span id="modalHeading">Add New Branch</span></div>
    <div class="modal-field"><label>School / Branch Name *</label><input type="text" id="inpName" placeholder="e.g. Delhi Public School - South Campus" /></div>
    <div class="modal-row">
      <div class="modal-field">
        <label>City *</label>
        <input type="text" id="inpCity" placeholder="e.g. New Delhi" list="citySuggestions" autocomplete="off" />
        <datalist id="citySuggestions"></datalist>
      </div>
      <div class="modal-field">
        <label>State</label>
        <select id="inpState">
          <option value="">-- Select State/UT --</option>
          <optgroup label="States">
            <option>Andhra Pradesh</option><option>Arunachal Pradesh</option><option>Assam</option><option>Bihar</option><option>Chhattisgarh</option><option>Goa</option><option>Gujarat</option><option>Haryana</option><option>Himachal Pradesh</option><option>Jharkhand</option><option>Karnataka</option><option>Kerala</option><option>Madhya Pradesh</option><option>Maharashtra</option><option>Manipur</option><option>Meghalaya</option><option>Mizoram</option><option>Nagaland</option><option>Odisha</option><option>Punjab</option><option>Rajasthan</option><option>Sikkim</option><option>Tamil Nadu</option><option>Telangana</option><option>Tripura</option><option>Uttar Pradesh</option><option>Uttarakhand</option><option>West Bengal</option>
          </optgroup>
          <optgroup label="Union Territories">
            <option>Andaman and Nicobar Islands</option><option>Chandigarh</option><option>Dadra and Nagar Haveli and Daman and Diu</option><option>Delhi</option><option>Jammu and Kashmir</option><option>Ladakh</option><option>Lakshadweep</option><option>Puducherry</option>
          </optgroup>
        </select>
      </div>
    </div>
    <div class="modal-field"><label>Full Address</label><textarea id="inpAddress" placeholder="Branch full address…"></textarea></div>
    <div class="modal-row">
      <div class="modal-field"><label>Principal Name</label><input type="text" id="inpPrincipal" placeholder="e.g. Dr. Sharma" /></div>
      <div class="modal-field"><label>Contact Number</label><input type="text" id="inpContact" placeholder="e.g. 011-26537890" /></div>
    </div>
    <div class="modal-row">
      <div class="modal-field"><label>Email</label><input type="email" id="inpEmail" placeholder="e.g. south@dps.edu.in" /></div>
      <div class="modal-field"><label>Affiliation No.</label><input type="text" id="inpAffil" placeholder="e.g. 2730098" /></div>
    </div>
    <div class="modal-row">
      <div class="modal-field"><label>Established Year</label><input type="text" id="inpYear" placeholder="e.g. 2005" /></div>
      <div class="modal-field">
        <label>Status</label>
        <select id="inpStatus"><option value="Active">Active</option><option value="Inactive">Inactive</option></select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveSchool()"><i class="ti ti-check"></i> Save</button>
    </div>
  </div>
</div>

<script>
const indianCities = ["Agra","Ahmedabad","Ajmer","Akola","Aligarh","Allahabad","Ambattur","Amravati","Amritsar","Asansol","Aurangabad","Bareilly","Belgaum","Bengaluru","Bhavnagar","Bhilai","Bhiwandi","Bhopal","Bhubaneswar","Bikaner","Chandigarh","Chennai","Coimbatore","Cuttack","Dehradun","Delhi","Dhanbad","Durgapur","Erode","Faridabad","Firozabad","Gaya","Ghaziabad","Gorakhpur","Gulbarga","Guntur","Gurgaon","Guwahati","Gwalior","Howrah","Hubli-Dharwad","Hyderabad","Indore","Jabalpur","Jaipur","Jalandhar","Jammu","Jamnagar","Jamshedpur","Jhansi","Jodhpur","Kalyan-Dombivli","Kanpur","Kochi","Kolhapur","Kolkata","Kota","Kurnool","Ladakh","Loni","Lucknow","Ludhiana","Madurai","Malegaon","Mangalore","Meerut","Mira-Bhayandar","Moradabad","Mumbai","Mysore","Nagpur","Nanded","Nashik","Navi Mumbai","Nellore","New Delhi","Noida","Patna","Pimpri-Chinchwad","Pune","Raipur","Rajahmundry","Rajkot","Ranchi","Rourkela","Saharanpur","Salem","Sangli-Miraj & Kupwad","Siliguri","Solapur","Srinagar","Surat","Thane","Thiruvananthapuram","Tiruchirappalli","Tirunelveli","Tiruppur","Udaipur","Ujjain","Ulhasnagar","Vadodara","Varanasi","Vasai-Virar","Vijayawada","Visakhapatnam"];
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("citySuggestions").innerHTML = indianCities.map(c => `<option value="${c}">`).join("");
});
let schools = [
  { id:1, name:'Delhi Public School - Main Campus', city:'New Delhi', state:'Delhi', address:'Mathura Road, New Delhi 110003', principal:'Dr. Asha Gupta', contact:'011-26537890', email:'main@dps.edu.in', affil:'2730001', year:'1972', status:'Active', students: 3200 },
  { id:2, name:'Delhi Public School - South Campus', city:'Noida', state:'Uttar Pradesh', address:'Sector 30, Noida 201303', principal:'Mr. Rajeev Mehta', contact:'0120-4567890', email:'south@dps.edu.in', affil:'2730045', year:'2005', status:'Active', students: 1850 },
  { id:3, name:'Delhi Public School - Gurgaon', city:'Gurgaon', state:'Haryana', address:'Sector 45, Gurgaon 122003', principal:'Mrs. Sunita Verma', contact:'0124-4123456', email:'gurgaon@dps.edu.in', affil:'2730067', year:'2010', status:'Active', students: 2100 },
  { id:4, name:'Delhi Public School - Jaipur', city:'Jaipur', state:'Rajasthan', address:'Tonk Road, Jaipur 302018', principal:'Dr. Vikram Singh', contact:'0141-2703456', email:'jaipur@dps.edu.in', affil:'2730089', year:'2015', status:'Active', students: 1400 },
  { id:5, name:'Delhi Public School - Lucknow', city:'Lucknow', state:'Uttar Pradesh', address:'Gomti Nagar, Lucknow 226010', principal:'Mrs. Kavita Rao', contact:'0522-4567890', email:'lucknow@dps.edu.in', affil:'2730112', year:'2018', status:'Inactive', students: 600 },
];
let nextId = 6, editingId = null;

function render() {
  const grid = document.getElementById('schoolsGrid');
  grid.innerHTML = schools.map(s => `
    <div class="school-card">
      <div class="school-card-header">
        <div class="school-logo"><i class="ti ti-building"></i></div>
        <div>
          <div class="school-title">${s.name}</div>
          <div class="school-city"><i class="ti ti-map-pin" style="font-size:13px;"></i> ${s.city}, ${s.state}</div>
        </div>
      </div>
      <div class="school-meta">
        <div class="meta-item"><div class="meta-label">Principal</div><div class="meta-val">${s.principal}</div></div>
        <div class="meta-item"><div class="meta-label">Students</div><div class="meta-val">${s.students.toLocaleString()}</div></div>
        <div class="meta-item"><div class="meta-label">Contact</div><div class="meta-val">${s.contact}</div></div>
        <div class="meta-item"><div class="meta-label">Established</div><div class="meta-val">${s.year}</div></div>
      </div>
      <div class="school-card-footer">
        <span class="badge badge-${s.status.toLowerCase()}">${s.status}</span>
        <div class="card-actions">
          <button class="card-btn" onclick="editSchool(${s.id})" title="Edit"><i class="ti ti-edit"></i></button>
          <button class="card-btn danger" onclick="deleteSchool(${s.id})" title="Delete"><i class="ti ti-trash"></i></button>
        </div>
      </div>
    </div>
  `).join('');

  document.getElementById('statTotal').textContent = schools.length;
  document.getElementById('statCities').textContent = new Set(schools.map(s => s.city)).size;
  document.getElementById('statStudents').textContent = schools.reduce((a,s) => a + s.students, 0).toLocaleString();
  document.getElementById('statActive').textContent = schools.filter(s => s.status === 'Active').length;
}

function openModal() {
  editingId = null;
  document.getElementById('modalHeading').textContent = 'Add New Branch';
  ['inpName','inpCity','inpState','inpAddress','inpPrincipal','inpContact','inpEmail','inpAffil','inpYear'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('inpStatus').value = 'Active';
  document.getElementById('modalOverlay').classList.add('open');
}
function editSchool(id) {
  const s = schools.find(x => x.id === id); if (!s) return;
  editingId = id;
  document.getElementById('modalHeading').textContent = 'Edit Branch';
  document.getElementById('inpName').value = s.name;
  document.getElementById('inpCity').value = s.city;
  document.getElementById('inpState').value = s.state;
  document.getElementById('inpAddress').value = s.address;
  document.getElementById('inpPrincipal').value = s.principal;
  document.getElementById('inpContact').value = s.contact;
  document.getElementById('inpEmail').value = s.email;
  document.getElementById('inpAffil').value = s.affil;
  document.getElementById('inpYear').value = s.year;
  document.getElementById('inpStatus').value = s.status;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
function saveSchool() {
  const name = document.getElementById('inpName').value.trim();
  const city = document.getElementById('inpCity').value.trim();
  if (!name || !city) { alert('Please fill in Name and City.'); return; }
  const data = { name, city, state: document.getElementById('inpState').value.trim(), address: document.getElementById('inpAddress').value.trim(), principal: document.getElementById('inpPrincipal').value.trim(), contact: document.getElementById('inpContact').value.trim(), email: document.getElementById('inpEmail').value.trim(), affil: document.getElementById('inpAffil').value.trim(), year: document.getElementById('inpYear').value.trim(), status: document.getElementById('inpStatus').value };
  if (editingId) { const s = schools.find(x => x.id === editingId); if (s) Object.assign(s, data); }
  else { schools.push({ id: nextId++, ...data, students: 0 }); }
  closeModal(); render();
}
function deleteSchool(id) { if (confirm('Delete this branch?')) { schools = schools.filter(s => s.id !== id); render(); } }

render();
</script>
<script src="sidebar.js"></script>
</body>
</html>
