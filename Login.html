<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login - BodhyaMarg ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<style>
  :root {
    --green: #0b7b3f; /* Matching the header green */
    --text-main: #1e293b;
    --text-muted: #64748b;
    --bg-color: #f8fafc;
    --white: #ffffff;
    --border: #e2e8f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-color);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  
  /* Header Section */
  .header {
    background-color: var(--green);
    color: var(--white);
    padding: 16px 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .school-logo {
    width: 65px; 
    height: auto;
  }
  .school-titles {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .school-name {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.5px;
    line-height: 1.2;
  }
  .school-sub {
    font-size: 12px;
    font-weight: 600;
    margin-top: 2px;
  }
  .school-sub2 {
    font-size: 10px;
    font-weight: 400;
    margin-top: 1px;
    opacity: 0.9;
  }
  .header-nav {
    display: flex;
    gap: 32px;
  }
  .header-nav a {
    color: var(--white);
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    transition: opacity 0.2s;
  }
  .header-nav a:hover {
    opacity: 0.8;
  }
  
  /* Main Content Layout */
  .main-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }
  .login-wrapper {
    display: flex;
    max-width: 1050px;
    width: 100%;
    gap: 48px;
    align-items: stretch;
  }
  
  /* Left Banner Image */
  .banner-section {
    flex: 1.1;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  }
  .banner-section img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  
  /* Right Login Form */
  .login-section {
    flex: 0.9;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 420px;
  }
  .login-card {
    background: var(--white);
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.04);
    border: 1px solid rgba(0,0,0,0.02);
  }
  .login-title {
    font-size: 26px;
    font-weight: 700;
    color: #1e3a5f; /* Dark navy blue from the image */
    margin-bottom: 6px;
  }
  .login-subtitle {
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 32px;
  }
  
  .form-group {
    margin-bottom: 20px;
  }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #334155;
    margin-bottom: 8px;
  }
  .input-wrapper {
    position: relative;
  }
  .form-control {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    color: var(--text-main);
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-control:focus {
    border-color: var(--green);
  }
  .eye-icon {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    cursor: pointer;
    font-size: 18px;
  }
  
  .form-options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  .remember-me {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #334155;
    cursor: pointer;
  }
  .remember-me input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--green);
    cursor: pointer;
  }
  .forgot-password {
    font-size: 13px;
    font-weight: 600;
    color: var(--green);
    text-decoration: none;
  }
  
  .btn-login {
    width: 100%;
    padding: 12px;
    background: var(--green);
    color: var(--white);
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-login:hover {
    background: #096332;
  }
  
  .create-account {
    text-align: center;
    margin-top: 24px;
    font-size: 13px;
    color: var(--text-muted);
  }
  .create-account a {
    color: var(--green);
    font-weight: 600;
    text-decoration: none;
  }
  
  .powered-by {
    text-align: center;
    margin-top: 32px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-main);
  }
  .powered-by span {
    color: var(--green);
  }

  /* Responsive Adjustments */
  @media (max-width: 900px) {
    .login-wrapper {
      flex-direction: column;
      max-width: 500px;
    }
    .header {
      flex-direction: column;
      gap: 20px;
      padding: 16px 20px;
      text-align: center;
    }
    .header-nav {
      gap: 16px;
    }
    .school-titles {
      align-items: center;
    }
  }
</style>
</head>
<body>

  <!-- Header Section -->
  <header class="header">
    <div class="header-left">
      <!-- PLACEHOLDER FOR LOGO -->
      <img src="school_logo.png" alt="DPS Logo" class="school-logo" onerror="this.src='https://via.placeholder.com/65x80?text=Logo'" />
      <div class="school-titles">
        <div class="school-name">DELHI PUBLIC SCHOOL</div>
        <div class="school-sub">Greater Faridabad</div>
        <div class="school-sub2">(Under the agencies of The DPS Society)</div>
      </div>
    </div>
    <nav class="header-nav">
      <a href="#">About</a>
      <a href="#">Academics</a>
      <a href="#">Admissions</a>
    </nav>
  </header>

  <!-- Main Content Layout -->
  <main class="main-container">
    <div class="login-wrapper">
      
      <!-- Left Banner Image -->
      <div class="banner-section">
        <!-- PLACEHOLDER FOR BANNER IMAGE -->
        <img src="login_banner.png" alt="Admissions Open Banner" onerror="this.src='https://via.placeholder.com/600x600?text=Banner+Image'" />
      </div>

      <!-- Right Login Form -->
      <div class="login-section">
        <div class="login-card">
          <h1 class="login-title">Welcome Back</h1>
          <p class="login-subtitle">Please enter your details to login</p>
          
          <div id="loginError" style="display: none; background: var(--red-light, #fee2e2); color: var(--red, #ef4444); padding: 12px; border-radius: 6px; font-size: 13px; font-weight: 600; margin-bottom: 20px;"></div>

          <form onsubmit="doLogin(event)">
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="emailField" class="form-control" placeholder="Enter your email" required />
            </div>
            
            <div class="form-group">
              <label>Password</label>
              <div class="input-wrapper">
                <input type="password" id="passwordField" class="form-control" placeholder="Enter your password" required />
                <i class="ti ti-eye-off eye-icon" onclick="togglePassword()"></i>
              </div>
            </div>
            
            <div class="form-options">
              <label class="remember-me">
                <input type="checkbox" checked />
                Remember Me
              </label>
              <a href="ForgotPassword.html" class="forgot-password">Forgot Password?</a>
            </div>
            
            <button type="submit" class="btn-login">Login</button>
            
            <div style="margin-top: 24px; border-top: 1px solid var(--border); padding-top: 16px;">
              <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px; text-align: center;">Quick Demo Login</p>
              <div style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;">
                <button type="button" onclick="quickLogin('admin')" style="padding: 6px 12px; border: 1px solid var(--border); background: var(--white); border-radius: 4px; font-size: 12px; cursor: pointer;">Admin</button>
                <button type="button" onclick="quickLogin('teacher')" style="padding: 6px 12px; border: 1px solid var(--border); background: var(--white); border-radius: 4px; font-size: 12px; cursor: pointer;">Teacher</button>
                <button type="button" onclick="quickLogin('student')" style="padding: 6px 12px; border: 1px solid var(--border); background: var(--white); border-radius: 4px; font-size: 12px; cursor: pointer;">Student</button>
                <button type="button" onclick="quickLogin('parent')" style="padding: 6px 12px; border: 1px solid var(--border); background: var(--white); border-radius: 4px; font-size: 12px; cursor: pointer;">Parent</button>
                <button type="button" onclick="quickLogin('staff')" style="padding: 6px 12px; border: 1px solid var(--border); background: var(--white); border-radius: 4px; font-size: 12px; cursor: pointer;">Staff</button>
              </div>
            </div>
          </form>
        </div>
        
        <div class="powered-by">
          Powered By <span>BodhyaMarg</span>
        </div>
      </div>

    </div>
  </main>

  <script src="permissions.js"></script>
  <script>
    // If already logged in → redirect to dashboard immediately
    if (BodhyaAuth.isLoggedIn()) {
      window.location.href = BodhyaAuth.getDashboard(BodhyaAuth.getRole());
    }

    function togglePassword() {
      const field = document.getElementById('passwordField');
      const icon  = document.querySelector('.eye-icon');
      if (field.type === 'password') {
        field.type = 'text';
        icon.classList.replace('ti-eye-off', 'ti-eye');
      } else {
        field.type = 'password';
        icon.classList.replace('ti-eye', 'ti-eye-off');
      }
    }

    function doLogin(e) {
      e.preventDefault();
      const email    = document.getElementById('emailField').value.trim();
      const password = document.getElementById('passwordField').value;
      const errEl    = document.getElementById('loginError');

      const user = BodhyaAuth.verify(email, password);
      if (user) {
        errEl.style.display = 'none';
        BodhyaAuth.login(user.role, user.name, user.id);
      } else {
        errEl.style.display = 'block';
        errEl.textContent = '⚠ Invalid email or password. Please try again.';
      }
    }

    function quickLogin(role) {
      const demoMap = {
        admin:      { email: 'admin@school.com',    password: 'admin123'   },
        teacher:    { email: 'teacher@school.com',  password: 'teacher123' },
        student:    { email: 'student@school.com',  password: 'student123' },
        parent:     { email: 'parent@school.com',   password: 'parent123'  },
        staff:      { email: 'staff@school.com',    password: 'staff123'   },
        superadmin: { email: 'superadmin@school.com', password: 'super123' },
      };
      const cred = demoMap[role];
      if (cred) {
        const user = BodhyaAuth.verify(cred.email, cred.password);
        if (user) BodhyaAuth.login(user.role, user.name, user.id);
      }
    }
  </script>
</body>
</html>
