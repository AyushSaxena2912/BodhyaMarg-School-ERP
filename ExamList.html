<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BodhyaMarg ERP – Exam List</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green: #1a7a4a; --green-light: #e6f4ee; --green-dark: #145e38;
  --bg: #f8fafc; --white: #ffffff; --border: #e2e8f0;
  --text: #1e293b; --text-muted: #64748b; --text-hint: #94a3b8;
  --primary: #4338ca; --primary-hover: #3730a3; --primary-light: #e0e7ff;
  --radius: 8px; --radius-lg: 12px;
}
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; }

.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 10px 24px; background: var(--white); border-bottom: 1px solid var(--border); flex-shrink: 0; justify-content: space-between; }
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-title { font-size: 20px; font-weight: 700; color: #1e293b; }
.breadcrumb { font-size: 13px; color: var(--text-hint); display: flex; align-items: center; gap: 6px; }
.breadcrumb .current { font-weight: 600; color: var(--text); }

.topbar-right { display: flex; align-items: center; gap: 12px; }
.btn-icon { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--radius); border: 1px solid var(--border); background: var(--white); cursor: pointer; color: var(--text-muted); transition: all 0.2s; font-size: 16px; }
.btn-icon:hover { background: var(--bg); color: var(--text); }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--white); color: var(--text); transition: all 0.2s; white-space: nowrap; }
.btn:hover { background: var(--bg); }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-hover); color: #fff; }

.content { flex: 1; overflow-y: auto; padding: 24px; }
.content::-webkit-scrollbar { width: 4px; }
.content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* Filter & Controls */
.controls-card { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; background: var(--white); padding: 16px 20px; border-radius: var(--radius-lg); border: 1px solid var(--border); }
.controls-title { font-size: 16px; font-weight: 700; color: var(--text); }
.controls-right { display: flex; align-items: center; gap: 12px; }

.input-box { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); padding: 8px 12px; border-radius: var(--radius); font-size: 13px; color: var(--text-muted); }
.input-box i { color: var(--text-hint); font-size: 16px; }
.input-box input { border: none; outline: none; background: transparent; font-family: inherit; font-size: 13px; color: var(--text); }

/* Table Wrapper */
.table-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; display: flex; flex-direction: column; }
.table-toolbar { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
.table-entries { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); }
.table-entries select { padding: 6px 10px; border-radius: var(--radius); border: 1px solid var(--border); outline: none; font-family: inherit; font-size: 13px; }
.table-search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); padding: 6px 12px; border-radius: var(--radius); }
.table-search input { border: none; outline: none; background: transparent; font-size: 13px; font-family: inherit; width: 200px; }

table { width: 100%; border-collapse: collapse; }
thead tr { background: #f8fafc; border-bottom: 1px solid var(--border); }
thead th { padding: 14px 20px; font-size: 12px; font-weight: 600; color: var(--text-muted); text-align: left; position: relative; }
thead th i { font-size: 14px; position: absolute; right: 16px; color: var(--border); cursor: pointer; }
tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: #f8fafc; }
tbody td { padding: 14px 20px; font-size: 13.5px; color: var(--text); vertical-align: middle; }

.checkbox-cell { width: 48px; }
.checkbox-custom { width: 18px; height: 18px; border: 1.5px solid var(--text-hint); border-radius: 4px; display: inline-block; cursor: pointer; position: relative; }
.checkbox-custom.checked { background: var(--primary); border-color: var(--primary); }
.checkbox-custom.checked::after { content: ''; position: absolute; left: 5px; top: 2px; width: 5px; height: 10px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }

.action-dots { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer; color: var(--text-hint); font-size: 18px; }
.action-dots:hover { background: var(--bg); color: var(--text); }
</style>
<style>
.sidebar a,.sidebar a:link,.sidebar a:visited,.sidebar a:hover,.sidebar a:active{text-decoration:none!important;color:inherit;}
</style>
</head>
<body>

<div id="sidebar-container"></div>

<div class="main">
  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-title">Exam</div>
      <div class="breadcrumb">
        Dashboard <span style="margin:0 4px;">/</span> Academic <span style="margin:0 4px;">/</span> <span class="current">Exam</span>
      </div>
    </div>
    <div class="topbar-right">
      <button class="btn-icon" title="Refresh"><i class="ti ti-refresh"></i></button>
      <button class="btn-icon" title="Print"><i class="ti ti-printer"></i></button>
      <button class="btn"><i class="ti ti-file-export"></i> Export <i class="ti ti-chevron-down" style="font-size:14px;color:var(--text-hint);"></i></button>
      <button class="btn btn-primary"><i class="ti ti-plus"></i> Add Exam</button>
    </div>
  </div>

  <!-- Content -->
  <div class="content">
    
    <!-- Controls Card -->
    <div class="controls-card">
      <div class="controls-title">Exam List</div>
      <div class="controls-right">
        <div class="input-box">
          <i class="ti ti-calendar"></i>
          <input type="text" value="05/21/2026 - 05/27/2026" readonly style="width: 170px;" />
        </div>
        <button class="btn"><i class="ti ti-filter"></i> Filter <i class="ti ti-chevron-down" style="font-size:14px;color:var(--text-hint);"></i></button>
        <button class="btn"><i class="ti ti-arrows-sort"></i> Sort by A-Z <i class="ti ti-chevron-down" style="font-size:14px;color:var(--text-hint);"></i></button>
      </div>
    </div>

    <!-- Table -->
    <div class="table-card">
      <div class="table-toolbar">
        <div class="table-entries">
          Row Per Page 
          <select>
            <option>10</option>
            <option>25</option>
            <option>50</option>
          </select>
          Entries
        </div>
        <div class="table-search">
          <input type="text" placeholder="Search" />
        </div>
      </div>
      
      <table>
        <thead>
          <tr>
            <th class="checkbox-cell"><div class="checkbox-custom"></div></th>
            <!-- ID column removed as requested by user -->
            <th>Exam Name <i class="ti ti-arrows-vertical"></i></th>
            <th>Exam Date <i class="ti ti-arrows-vertical"></i></th>
            <th>Start Time <i class="ti ti-arrows-vertical"></i></th>
            <th>End Time <i class="ti ti-arrows-vertical"></i></th>
            <th>Action <i class="ti ti-arrows-vertical"></i></th>
          </tr>
        </thead>
        <tbody id="examBody">
          <!-- Populated by JS -->
        </tbody>
      </table>
    </div>

  </div>
</div>

<script>
// Mock Data based on User Request
const examData = [
  { name: 'Formative Assessment- 1', date: '15 Nov 2024', start: '09:30 AM', end: '12:30 PM' },
  { name: 'Formative Assessment- 2', date: '18 Jul 2024', start: '10:30 AM', end: '12:30 PM' },
  { name: 'Formative Assessment- 3', date: '26 Aug 2024', start: '09:00 AM', end: '12:00 PM' },
  { name: 'Formative Assessment- 4', date: '20 Jun 2024', start: '11:00 AM', end: '12:00 PM' },
  { name: 'Summative Assessment- 1', date: '15 Jun 2024', start: '10:30 AM', end: '11:30 PM' },
  { name: 'Summative Assessment- 2', date: '27 May 2024', start: '09:30 AM', end: '11:00 AM' }
];

function renderExams() {
  const tbody = document.getElementById('examBody');
  let html = '';
  examData.forEach(exam => {
    html += `
      <tr>
        <td class="checkbox-cell"><div class="checkbox-custom"></div></td>
        <td style="font-weight: 500;">${exam.name}</td>
        <td>${exam.date}</td>
        <td>${exam.start}</td>
        <td>${exam.end}</td>
        <td><div class="action-dots"><i class="ti ti-dots-vertical"></i></div></td>
      </tr>
    `;
  });
  tbody.innerHTML = html;

  // Add click handlers for custom checkboxes
  document.querySelectorAll('.checkbox-custom').forEach(cb => {
    cb.addEventListener('click', function() {
      this.classList.toggle('checked');
    });
  });
}

document.addEventListener('DOMContentLoaded', renderExams);
</script>
<script src="sidebar.js"></script>
</body>
</html>
