<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BodhyaMarg ERP – Collect Fees</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --green: #1a7a4a; --green-light: #e6f4ee; --green-dark: #145e38; --bg: #f4f6f8; --white: #ffffff; --border: #e2e6ea; --text: #1a1d23; --text-muted: #6b7280; --text-hint: #9ca3af; --radius: 8px; --radius-lg: 12px; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; }
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 10px 24px; background: var(--white); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.topbar-search { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 12px; width: 280px; }
.topbar-search i { font-size: 14px; color: var(--text-hint); } .topbar-search input { border: none; background: transparent; font-size: 12.5px; font-family: inherit; outline: none; width: 100%; }
.topbar-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.icon-btn { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius); border: 1px solid var(--border); background: var(--white); cursor: pointer; color: var(--text-muted); }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--green); color: #fff; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.content { flex: 1; overflow-y: auto; padding: 24px; }
.content::-webkit-scrollbar { width: 4px; } .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
.page-header h1 { font-size: 20px; font-weight: 600; }
.breadcrumb { font-size: 11.5px; color: var(--text-hint); margin-top: 3px; display: flex; align-items: center; gap: 4px; } .breadcrumb span { color: var(--green); }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius); font-size: 12.5px; font-weight: 500; font-family: inherit; cursor: pointer; border: 1px solid var(--border); background: var(--white); color: var(--text); white-space: nowrap; }
.btn:hover { background: var(--bg); } .btn-primary { background: var(--green); color: #fff; border-color: var(--green); } .btn-primary:hover { background: var(--green-dark); }
.btn-success { background: #059669; color: #fff; border-color: #059669; } .btn-success:hover { background: #047857; }

/* Search Student Section */
.search-section { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 20px; }
.search-section h3 { font-size: 14px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.search-section h3 i { color: var(--green); }
.search-bar { display: flex; gap: 10px; }
.search-bar input { flex: 1; font-family: inherit; font-size: 12.5px; border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 12px; outline: none; }
.search-bar input:focus { border-color: var(--green); }

/* Student Profile Card */
.student-profile { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 20px; display: none; }
.student-profile.show { display: block; }
.sp-header { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
.sp-avatar { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, var(--green), var(--green-dark)); color: #fff; font-size: 20px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.sp-name { font-size: 16px; font-weight: 600; }
.sp-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
.sp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.sp-item { font-size: 11.5px; }
.sp-item .label { color: var(--text-hint); }
.sp-item .val { font-weight: 600; margin-top: 2px; }

/* Fees Table */
.fees-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; display: none; }
.fees-card.show { display: block; }
.fees-card h3 { padding: 16px 18px; border-bottom: 1px solid var(--border); font-size: 14px; display: flex; align-items: center; gap: 8px; }
.fees-card h3 i { color: var(--green); }
table { width: 100%; border-collapse: collapse; }
thead tr { background: var(--bg); border-bottom: 1px solid var(--border); }
thead th { padding: 11px 18px; font-size: 12px; font-weight: 600; color: var(--text-muted); text-align: left; }
tbody tr { border-bottom: 1px solid var(--border); } tbody tr:hover { background: #fafbfc; }
tbody td { padding: 12px 18px; font-size: 12.5px; vertical-align: middle; }
.amount { font-weight: 600; color: var(--green); }
.amount-due { font-weight: 600; color: #dc2626; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; }
.badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; }
.badge-paid { background: var(--green-light); color: var(--green); } .badge-paid::before { background: var(--green); }
.badge-due { background: #fef2f2; color: #dc2626; } .badge-due::before { background: #dc2626; }
.badge-partial { background: #fef3c7; color: #d97706; } .badge-partial::before { background: #d97706; }
.total-bar { padding: 16px 18px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: #fafbfc; }
.total-bar .total-label { font-size: 13px; font-weight: 600; }
.total-bar .total-amount { font-size: 18px; font-weight: 700; color: var(--green); }

/* Payment Section */
.payment-section { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; margin-top: 20px; display: none; }
.payment-section.show { display: block; }
.payment-section h3 { font-size: 14px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.payment-section h3 i { color: var(--green); }
.pay-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.pay-field { display: flex; flex-direction: column; gap: 5px; }
.pay-field label { font-size: 11px; font-weight: 500; color: var(--text-muted); }
.pay-field input, .pay-field select { font-family: inherit; font-size: 12.5px; border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 10px; outline: none; }
.pay-field input:focus, .pay-field select:focus { border-color: var(--green); }
.pay-footer { margin-top: 16px; display: flex; gap: 10px; justify-content: flex-end; }
</style>
</head>
<body>
<div id="sidebar-container"></div>
<div class="main">
  <div class="topbar"><div class="topbar-search"><i class="ti ti-search"></i><input placeholder="Search anything…" /></div><div class="topbar-right"><div class="icon-btn"><i class="ti ti-bell"></i></div><div class="avatar">A</div></div></div>
  <div class="content">
    <div class="page-header">
      <div><h1>Collect Fees</h1><div class="breadcrumb">Dashboard <i class="ti ti-chevron-right"></i> Fees <i class="ti ti-chevron-right"></i> <span>Collect Fees</span></div></div>
    </div>

    <!-- Search -->
    <div class="search-section">
      <h3><i class="ti ti-user-search"></i> Search Student</h3>
      <div class="search-bar">
        <input id="searchInput" placeholder="Enter Student Name, Roll No, or Admission No…" onkeydown="if(event.key==='Enter')searchStudent()" />
        <button class="btn btn-primary" onclick="searchStudent()"><i class="ti ti-search"></i> Search</button>
      </div>
    </div>

    <!-- Student Profile -->
    <div class="student-profile" id="studentProfile">
      <div class="sp-header">
        <div class="sp-avatar" id="spAvatar">A</div>
        <div><div class="sp-name" id="spName"></div><div class="sp-meta" id="spMeta"></div></div>
      </div>
      <div class="sp-grid" id="spGrid"></div>
    </div>

    <!-- Fees Table -->
    <div class="fees-card" id="feesCard">
      <h3><i class="ti ti-receipt"></i> Fee Details</h3>
      <table><thead><tr><th>Fee Type</th><th>Group</th><th>Due Date</th><th>Amount</th><th>Paid</th><th>Balance</th><th>Status</th></tr></thead><tbody id="feesTb"></tbody></table>
      <div class="total-bar"><div class="total-label">Total Balance Due</div><div class="total-amount" id="totalDue"></div></div>
    </div>

    <!-- Payment -->
    <div class="payment-section" id="paySection">
      <h3><i class="ti ti-credit-card"></i> Record Payment</h3>
      <div class="pay-grid">
        <div class="pay-field"><label>Amount to Pay (₹)</label><input type="number" id="payAmt" placeholder="Enter amount" /></div>
        <div class="pay-field"><label>Payment Mode</label><select id="payMode"><option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Cheque</option><option>Credit Card</option></select></div>
        <div class="pay-field"><label>Date</label><input type="date" id="payDate" /></div>
      </div>
      <div class="pay-footer">
        <button class="btn" onclick="printReceipt()"><i class="ti ti-printer"></i> Print Receipt</button>
        <button class="btn btn-success" onclick="collectPayment()"><i class="ti ti-check"></i> Collect Payment</button>
      </div>
    </div>
  </div>
</div>
<script>
const mockStudents=[
  {name:'Aarav Sharma',roll:'VIII-A-01',cls:'VIII',sec:'A',admNo:'ADM2021001',father:'Rajesh Sharma',phone:'9876543210',
   fees:[
     {type:'Tuition Fee',group:'Academic',due:'2026-04-15',amount:15000,paid:15000},
     {type:'Lab Fee',group:'Academic',due:'2026-04-15',amount:3000,paid:0},
     {type:'Bus Fee',group:'Transport',due:'2026-04-10',amount:4500,paid:2000},
     {type:'Sports Fee',group:'Activity',due:'2026-05-01',amount:2000,paid:0},
     {type:'Exam Fee',group:'Exam',due:'2026-03-01',amount:1500,paid:1500},
   ]},
  {name:'Diya Patel',roll:'VIII-A-02',cls:'VIII',sec:'A',admNo:'ADM2021002',father:'Nilesh Patel',phone:'9876543211',
   fees:[
     {type:'Tuition Fee',group:'Academic',due:'2026-04-15',amount:15000,paid:7500},
     {type:'Lab Fee',group:'Academic',due:'2026-04-15',amount:3000,paid:3000},
     {type:'Hostel Fee',group:'Hostel',due:'2026-04-10',amount:12000,paid:0},
     {type:'Exam Fee',group:'Exam',due:'2026-03-01',amount:1500,paid:0},
   ]},
];

function searchStudent(){
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  const s=mockStudents.find(x=>x.name.toLowerCase().includes(q)||x.roll.toLowerCase().includes(q)||x.admNo.toLowerCase().includes(q));
  if(!s){alert('Student not found. Try "Aarav" or "Diya".');return;}
  document.getElementById('spAvatar').textContent=s.name[0];
  document.getElementById('spName').textContent=s.name;
  document.getElementById('spMeta').textContent=`Roll: ${s.roll} | Class: ${s.cls}-${s.sec}`;
  document.getElementById('spGrid').innerHTML=`
    <div class="sp-item"><div class="label">Admission No</div><div class="val">${s.admNo}</div></div>
    <div class="sp-item"><div class="label">Father's Name</div><div class="val">${s.father}</div></div>
    <div class="sp-item"><div class="label">Phone</div><div class="val">${s.phone}</div></div>
    <div class="sp-item"><div class="label">Class / Section</div><div class="val">${s.cls} - ${s.sec}</div></div>`;
  document.getElementById('studentProfile').classList.add('show');

  let totalDue=0;
  document.getElementById('feesTb').innerHTML=s.fees.map(f=>{
    const bal=f.amount-f.paid;totalDue+=bal;
    const st=bal===0?'paid':f.paid>0?'partial':'due';
    return `<tr><td style="font-weight:500">${f.type}</td><td style="color:var(--text-muted);font-size:12px">${f.group}</td><td style="font-size:12px">${f.due}</td><td>₹${f.amount.toLocaleString('en-IN')}</td><td class="amount">₹${f.paid.toLocaleString('en-IN')}</td><td class="${bal>0?'amount-due':'amount'}">₹${bal.toLocaleString('en-IN')}</td><td><span class="badge badge-${st}">${st==='paid'?'Paid':st==='partial'?'Partial':'Due'}</span></td></tr>`;
  }).join('');
  document.getElementById('totalDue').textContent='₹'+totalDue.toLocaleString('en-IN');
  document.getElementById('feesCard').classList.add('show');
  document.getElementById('paySection').classList.add('show');
  document.getElementById('payDate').valueAsDate=new Date();
  document.getElementById('payAmt').value=totalDue;
}
function collectPayment(){
  const amt=document.getElementById('payAmt').value;
  if(!amt||amt<=0)return alert('Enter a valid amount');
  alert('✅ Payment of ₹'+parseInt(amt).toLocaleString('en-IN')+' collected via '+document.getElementById('payMode').value+'!');
}
function printReceipt(){alert('🖨️ Receipt printing… (simulated)');}
</script>
<script src="sidebar.js"></script>
</body>
</html>
