<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Internal Connection Issue - BodhyaMarg ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { 
    --green: #1a7a4a; --green-light: #e6f4ee; --green-dark: #145e38; 
    --bg: #f4f6f8; --white: #ffffff; --border: #e2e6ea; 
    --text: #1a1d23; --text-muted: #6b7280; --text-hint: #9ca3af; 
    --radius: 8px; --radius-lg: 12px; 
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; }
  
  /* Layout Classes */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 10px 24px; background: var(--white); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .topbar-search { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 12px; width: 280px; }
  .topbar-search i { font-size: 14px; color: var(--text-hint); } 
  .topbar-search input { border: none; background: transparent; font-size: 12.5px; font-family: inherit; outline: none; width: 100%; }
  .topbar-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .icon-btn { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius); border: 1px solid var(--border); background: var(--white); cursor: pointer; color: var(--text-muted); }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--green); color: #fff; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  
  .content { flex: 1; overflow-y: auto; padding: 24px; }
  .content::-webkit-scrollbar { width: 4px; } 
  .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  
  /* Page Title */
  .page-title h1 { font-size: 20px; font-weight: 600; }
  .breadcrumb { font-size: 11.5px; color: var(--text-hint); margin-top: 3px; display: flex; align-items: center; gap: 4px; }
  .breadcrumb span { color: var(--green); }

  /* Section Card */
  .section-card { 
    background: var(--white); 
    border: 1px solid var(--border); 
    border-radius: var(--radius-lg); 
    padding: 60px 24px; 
    margin-top: 20px; 
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    min-height: 60vh;
    justify-content: center;
  }

  /* Error Specific */
  .art-wrapper {
    width: 200px;
    height: 200px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .art-wrapper svg { width: 100%; height: 100%; }
  
  .badge {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 6px 14px;
    border-radius: 20px;
    display: inline-block;
    margin-bottom: 16px;
    background: #fee2e2;
    color: #b91c1c;
  }

  .error-title { font-size: 28px; font-weight: 700; color: var(--text); margin-bottom: 12px; }
  .error-desc { font-size: 14.5px; color: var(--text-muted); line-height: 1.6; margin-bottom: 32px; max-width: 500px; }

  /* Buttons */
  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn { 
    display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; 
    border-radius: var(--radius); font-size: 13.5px; font-weight: 600; 
    cursor: pointer; transition: all 0.2s; text-decoration: none; 
    border: 1px solid var(--border); background: var(--white); color: var(--text);
  }
  .btn:hover { background: var(--bg); }
  .btn-primary { background: var(--green); color: var(--white); border-color: var(--green); }
  .btn-primary:hover { background: var(--green-dark); border-color: var(--green-dark); }

  /* Animations */
  .float { animation: floatAnim 4s ease-in-out infinite; }
  .pulse { animation: pulseAnim 2.5s ease-in-out infinite; }
  @keyframes floatAnim { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
  @keyframes pulseAnim { 0%, 100% { opacity: 0.5; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1); } }

</style>
</head>
<body>

<div id="sidebar-container"></div>

<div class="main">
  <div class="topbar">
    <div class="topbar-search"><i class="ti ti-search"></i><input placeholder="Search anything…" /></div>
    <div class="topbar-right">
      <div class="icon-btn"><i class="ti ti-bell"></i></div>
      <div class="avatar">AD</div>
    </div>
  </div>
  
  <div class="content">
    <div class="page-title">
      <h1>System Alert</h1>
      <div class="breadcrumb">Dashboard <i class="ti ti-chevron-right"></i> System Pages <i class="ti ti-chevron-right"></i> <span>Error 500</span></div>
    </div>

    <div class="section-card">
      <div class="art-wrapper">
        
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" class="float">
            <rect x="15" y="20" width="90" height="25" rx="6" fill="#1a1d23" stroke="#e2e6ea" stroke-width="4"/>
            <circle cx="35" cy="32.5" r="4" fill="#10b981"/>
            <circle cx="50" cy="32.5" r="4" fill="#10b981"/>
            
            <rect x="15" y="55" width="90" height="25" rx="6" fill="#1a1d23" stroke="#ef4444" stroke-width="4"/>
            <circle cx="35" cy="67.5" r="4" fill="#ef4444" class="pulse"/>
            <circle cx="50" cy="67.5" r="4" fill="#ef4444"/>
            <path d="M75 62 L85 72 M85 62 L75 72" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>

            <rect x="15" y="90" width="90" height="25" rx="6" fill="#1a1d23" stroke="#e2e6ea" stroke-width="4"/>
            <circle cx="35" cy="102.5" r="4" fill="#10b981"/>
            <circle cx="50" cy="102.5" r="4" fill="#10b981"/>
        </svg>
    
      </div>

      <div class="badge">Error Code: 500</div>
      <h1 class="error-title">Internal Connection Issue</h1>
      <p class="error-desc">Our portal is experiencing a temporary glitch. Don't worry, all your school records and data are safe. Please try reloading the system.</p>
      
      <div class="actions">
        <a href="AllStudents.html" class="btn btn-primary"><i class="ti ti-home"></i> Back to Dashboard</a>
        <button class="btn" onclick="window.location.reload()"><i class="ti ti-reload"></i> Reload</button>
      </div>
    </div>
  </div>
</div>

<script src="sidebar.js"></script>
</body>
</html>
