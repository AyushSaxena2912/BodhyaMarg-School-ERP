<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green: #1a7a4a; --green-light: #e6f4ee; --green-dark: #145e38;
  --bg: #f8fafc; --white: #ffffff; --border: #e2e8f0;
  --text: #1e293b; --text-muted: #64748b; --text-hint: #94a3b8;
  --radius: 8px; --radius-lg: 12px;
}
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; }

.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 10px 24px; background: var(--white); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.topbar-search { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 12px; width: 280px; }
.topbar-search i { font-size: 14px; color: var(--text-hint); }
.topbar-search input { border: none; background: transparent; font-size: 12.5px; font-family: inherit; outline: none; width: 100%; }
.topbar-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.icon-btn { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius); border: 1px solid var(--border); background: var(--white); cursor: pointer; color: var(--text-muted); }
.av { width: 34px; height: 34px; border-radius: 50%; background: var(--green); color: #fff; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; cursor: pointer; }

.content { flex: 1; overflow-y: auto; padding: 24px; }
.content::-webkit-scrollbar { width: 4px; }
.content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
.page-header h1 { font-size: 20px; font-weight: 600; }
.breadcrumb { font-size: 11.5px; color: var(--text-hint); margin-top: 3px; display: flex; align-items: center; gap: 4px; }
.bc-green { color: var(--green); font-weight: 500; }
.page-actions { display: flex; gap: 10px; align-items: center; }

.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--white); color: var(--text); transition: all 0.2s; white-space: nowrap; }
.btn:hover { background: var(--bg); }
.btn-primary { background: var(--green); color: #fff; border-color: var(--green); }
.btn-primary:hover { background: var(--green-dark); color: #fff; }

/* Filter & Controls */
.controls-card { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; background: var(--white); padding: 16px 20px; border-radius: var(--radius-lg); border: 1px solid var(--border); flex-wrap: wrap; gap: 16px; }
.controls-title { font-size: 16px; font-weight: 700; color: var(--text); margin-right: auto; }
.controls-filters { display: flex; align-items: center; gap: 12px; }

.input-box { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); padding: 8px 12px; border-radius: var(--radius); font-size: 13px; color: var(--text-muted); background: var(--white); }
.input-box select { border: none; outline: none; background: transparent; font-family: inherit; font-size: 13px; color: var(--text); padding-right: 4px; cursor: pointer; -webkit-appearance: none; appearance: none; }
.input-box i { color: var(--text-hint); font-size: 16px; }
.input-box .ti-chevron-down { font-size: 14px; margin-left: -4px; pointer-events: none; }

/* Table Wrapper */
.table-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.table-toolbar { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
.table-entries { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); }
.table-entries select { padding: 6px 28px 6px 10px; border-radius: var(--radius); border: 1px solid var(--border); outline: none; font-family: inherit; font-size: 13px; }
.table-search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); padding: 6px 12px; border-radius: var(--radius); }
.table-search input { border: none; outline: none; background: transparent; font-size: 13px; font-family: inherit; width: 200px; }

.table-responsive { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 1000px; }
thead tr { background: #f8fafc; border-bottom: 1px solid var(--border); }
thead th { padding: 14px 20px; font-size: 12px; font-weight: 600; color: var(--text-muted); text-align: left; position: relative; white-space: nowrap; }
thead th i { font-size: 14px; position: absolute; right: 8px; color: var(--border); cursor: pointer; }
tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: #f8fafc; }
tbody td { padding: 14px 20px; font-size: 13.5px; color: var(--text); vertical-align: middle; }

.checkbox-cell { width: 48px; }
.checkbox-custom { width: 18px; height: 18px; border: 1.5px solid var(--text-hint); border-radius: 4px; display: inline-block; cursor: pointer; position: relative; }
.checkbox-custom.checked { background: var(--green); border-color: var(--green); }
.checkbox-custom.checked::after { content: ''; position: absolute; left: 5px; top: 2px; width: 5px; height: 10px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }

.student-info { display: flex; align-items: center; gap: 12px; }
.student-av { width: 32px; height: 32px; border-radius: 50%; background: var(--primary-light, #e0e7ff); color: var(--primary, #4338ca); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px; }
.student-name { font-weight: 600; color: var(--text); }
.student-roll { font-size: 11px; color: var(--text-hint); margin-top: 2px; }

.action-dots { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer; color: var(--text-hint); font-size: 18px; transition: all 0.2s; }
.action-dots:hover { background: var(--bg); color: var(--text); }

.status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
.status-badge.pass { background: #ecfdf5; color: #10b981; }
.status-badge.fail { background: #fef2f2; color: #ef4444; }
.status-badge.grace { background: #fffbeb; color: #f59e0b; }
.status-badge.pass::before { content:''; width:6px; height:6px; border-radius:50%; background:#10b981; }
.status-badge.fail::before { content:''; width:6px; height:6px; border-radius:50%; background:#ef4444; }
.status-badge.grace::before { content:''; width:6px; height:6px; border-radius:50%; background:#f59e0b; }

.marks-fraction { font-family: monospace; font-size: 14px; }
.marks-obtained { font-weight: 600; color: var(--text); }
.marks-total { color: var(--text-hint); }

/* Modal Styles */
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.4); display: none; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(2px); }
.modal-overlay.active { display: flex; }
.modal { background: var(--white); width: 600px; max-width: 90%; border-radius: var(--radius-lg); box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; }
.modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #f8fafc; }
.modal-title { font-size: 16px; font-weight: 700; color: var(--text); }
.modal-close { cursor: pointer; color: var(--text-hint); transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 6px; }
.modal-close:hover { background: var(--border); color: var(--text); }
.modal-body { padding: 20px; max-height: 70vh; overflow-y: auto; }

.report-header { display: flex; gap: 16px; align-items: center; margin-bottom: 24px; }
.report-av { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; }
.report-info h3 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.report-info p { font-size: 13px; color: var(--text-muted); }

.report-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
.report-table th, .report-table td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
.report-table th { background: #f8fafc; font-weight: 600; color: var(--text-muted); }
.report-table td { color: var(--text); }
.report-table tr:last-child td { border-bottom: none; }

/* Pagination */
.pagination { display: flex; align-items: center; justify-content: flex-end; gap: 4px; padding: 12px 18px; border-top: 1px solid var(--border); background: #fafbfc; }
.pg-btn { min-width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius); font-size: 12px; font-family: inherit; cursor: pointer; border: 1px solid var(--border); background: var(--white); color: var(--text-muted); padding: 0 8px; transition: background 0.12s; gap: 4px; }
.pg-btn:hover { background: var(--bg); }
.pg-btn.active { background: var(--green); color: #fff; border-color: var(--green); font-weight: 600; }
.pg-btn i { font-size: 12px; }
.pg-dots { font-size: 12px; color: var(--text-hint); padding: 0 4px; }
</style>

<div id="sidebar-container"></div>

<div class="main">

      <input type="text" placeholder="Search..." />
    </div>
    <div class="topbar-right">

    </div>
  </div>

  <div class="content">
    
    <div class="page-header">

            <!-- Populated by JS -->

<script>
/*
 * ===== EXAM RESULT LOGIC =====
 * Rules:
 * 1. Passing marks per subject = 33 out of 100
 * 2. GRACE: If a student is short by ≤5 marks (i.e. scored 28-32) in EXACTLY 1 subject,
 *    then grace marks are awarded to bring them to 33. Grace can only be given in 1 subject.
 * 3. SUPPLEMENTARY: After applying grace, if student still fails in 1 or 2 subjects → Supplementary
 * 4. FAIL: After applying grace, if student fails in 3 or more subjects → Fail
 * 5. PASS: All subjects ≥ 33 (including after grace)
 */

const PASS_MARKS = 33;
const MAX_GRACE = 5; // Grace of up to 5 marks allowed
const subjectsList = ['Mathematics', 'Science', 'English', 'Hindi', 'Social Science'];

// Fixed, deterministic marks for each student so results don't change on refresh
const studentsRaw = [
  // 1. Clean pass – all subjects comfortably above 33
  { name: 'Aarav Sharma',  roll: 'X-A-01', classSec: 'Class X - A',
    marks: [92, 88, 85, 79, 91] },

  // 2. Good pass
  { name: 'Diya Patel',    roll: 'X-A-02', classSec: 'Class X - A',
    marks: [78, 82, 74, 69, 77] },

  // 3. Grace case – Maths = 30 (short by 3, ≤5 so grace applies), rest pass → PASS w/ Grace
  { name: 'Ishaan Verma',  roll: 'X-A-03', classSec: 'Class X - A',
    marks: [30, 55, 48, 62, 45] },

  // 4. Grace eligible in 1 subject (Science=29, short by 4) BUT also fail in another (Maths=18, short by 15)
  //    Grace can only be applied to 1 subject → apply grace to Science (29→33), Maths still fails → Supplementary
  { name: 'Kavya Singh',   roll: 'X-A-04', classSec: 'Class X - A',
    marks: [18, 29, 52, 44, 56] },

  // 5. 1 subject fail (Maths=20, too far for grace) → Supplementary
  { name: 'Rohan Gupta',   roll: 'X-A-05', classSec: 'Class X - A',
    marks: [20, 45, 55, 50, 60] },

  // 6. 3 subjects fail → FAIL (even if 1 is grace-eligible, still 3+ fail after grace)
  { name: 'Ananya Desai',  roll: 'X-A-06', classSec: 'Class X - A',
    marks: [15, 22, 12, 65, 58] },

  // 7. 2 subjects fail (both too far for grace) → Supplementary
  { name: 'Vihaan Joshi',  roll: 'X-A-07', classSec: 'Class X - A',
    marks: [25, 19, 68, 72, 55] },

  // 8. Grace case – Hindi=31 (short by 2, ≤5 so grace applies), rest pass → PASS w/ Grace
  { name: 'Myra Shah',     roll: 'X-A-08', classSec: 'Class X - A',
    marks: [45, 52, 67, 31, 48] },

  // 9. 2 subjects grace-eligible (Maths=30, Science=29) but grace only allowed in 1
  //    → Apply grace to best candidate (30→33), Science=29 still fails → Supplementary
  { name: 'Arjun Reddy',   roll: 'X-A-09', classSec: 'Class X - A',
    marks: [30, 29, 58, 61, 44] },

  // 10. 4 subjects fail → clearly FAIL
  { name: 'Priya Kumari',  roll: 'X-A-10', classSec: 'Class X - A',
    marks: [10, 15, 22, 8, 40] },

  // 11. EDGE CASE: 3 subjects fail, but 1 is grace-eligible (Maths=29, short by 4)
  //     → Grace applied to Maths (29→33), now only 2 fail → SUPPLEMENTARY (saved from Fail by grace!)
  { name: 'Neha Tiwari',   roll: 'X-A-11', classSec: 'Class X - A',
    marks: [29, 20, 25, 70, 60] },

  // 12. Barely passes everything (all subjects between 33-36) → clean PASS but low grades
  { name: 'Rahul Yadav',   roll: 'X-A-12', classSec: 'Class X - A',
    marks: [34, 35, 33, 36, 33] }
];

function getGrade(mark) {
  if (mark >= 90) return 'O';
  if (mark >= 80) return 'A+';
  if (mark >= 70) return 'A';
  if (mark >= 60) return 'B+';
  if (mark >= 50) return 'B';
  if (mark >= 33) return 'C';
  return 'F';
}

// Process each student with proper grace/supplementary/fail logic
const resultData = studentsRaw.map(student => {
  let subjects = student.marks.map((mark, i) => ({
    name: subjectsList[i],
    originalMark: mark,
    mark: mark,
    graceApplied: 0,
    grade: getGrade(mark)
  }));

  // Step 1: Find all subjects below passing marks
  let failedSubjects = subjects.filter(s => s.mark < PASS_MARKS);

  // Step 2: Try to apply grace (only 1 subject, only if shortfall ≤ MAX_GRACE)
  let graceUsed = false;
  if (failedSubjects.length > 0) {
    // Find the best candidate for grace: the one closest to passing (smallest shortfall)
    let graceEligible = failedSubjects
      .filter(s => (PASS_MARKS - s.mark) <= MAX_GRACE)
      .sort((a, b) => (PASS_MARKS - a.mark) - (PASS_MARKS - b.mark)); // closest first

    if (graceEligible.length > 0) {
      // Apply grace to the closest one only
      let target = graceEligible[0];
      let graceNeeded = PASS_MARKS - target.mark;
      target.graceApplied = graceNeeded;
      target.mark = PASS_MARKS; // Bring to passing
      target.grade = getGrade(target.mark);
      graceUsed = true;
    }
  }

  // Step 3: Recount failures after grace
  let finalFailCount = subjects.filter(s => s.mark < PASS_MARKS).length;

  // Step 4: Determine overall status
  let status = 'pass';
  if (finalFailCount >= 3) {
    status = 'fail';
  } else if (finalFailCount === 1 || finalFailCount === 2) {
    status = 'supplementary';
  } else if (graceUsed) {
    status = 'grace'; // All pass but only because of grace
  }

  // Calculate totals
  let obtained = subjects.reduce((sum, s) => sum + s.mark, 0);
  let percent = (obtained / 500 * 100).toFixed(1);

  // Overall grade
  let overallGrade;
  if (status === 'fail') {
    overallGrade = 'F';
  } else if (status === 'supplementary') {
    overallGrade = 'F';
  } else {
    overallGrade = getGrade(parseFloat(percent));
  }

  return {
    name: student.name,
    roll: student.roll,
    classSec: student.classSec,
    subjects,
    obtained,
    total: 500,
    percent: percent + '%',
    grade: overallGrade,
    status,
    graceUsed
  };
});

function getInitials(name) {
  return name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
}

function getAvatarColor(status) {
  if (status === 'pass')  return { bg: '#ecfdf5', text: '#10b981' };
  if (status === 'grace') return { bg: '#ecfdf5', text: '#10b981' };
  if (status === 'fail')  return { bg: '#fef2f2', text: '#ef4444' };
  return { bg: '#fffbeb', text: '#f59e0b' }; // supplementary
}

function getStatusText(status) {
  if (status === 'pass')          return 'Pass';
  if (status === 'grace')         return 'Pass w/ Grace';
  if (status === 'supplementary') return 'Supplementary';
  if (status === 'fail')          return 'Fail';
  return 'Pass';
}

function renderResults() {
  const tbody = document.getElementById('resultsBody');
  let html = '';

  resultData.forEach(item => {
    let statusText = getStatusText(item.status);
    let avColor = getAvatarColor(item.status);
    let badgeClass = item.status;
    if (item.status === 'supplementary') badgeClass = 'grace'; // orange badge

    html += `
      <tr>
        <td class="checkbox-cell"><div class="checkbox-custom"></div></td>
        <td>
          <div class="student-info">
            <div class="student-av" style="background:${avColor.bg}; color:${avColor.text};">${getInitials(item.name)}</div>
            <div>
              <div class="student-name">${item.name}</div>
              <div class="student-roll">Roll: ${item.roll}</div>
            </div>
          </div>
        </td>
        <td style="color: var(--text-muted); font-weight: 500;">${item.classSec}</td>
        <td>
          <div class="marks-fraction"><span class="marks-obtained">${item.obtained}</span><span class="marks-total">/${item.total}</span></div>
        </td>
        <td style="font-weight: 600;">${item.percent}</td>
        <td style="font-weight: 600; color: ${item.grade === 'F' ? '#ef4444' : 'var(--green)'};">${item.grade}</td>
        <td><span class="status-badge ${badgeClass}">${statusText}</span></td>
        <td><a href="StudentReportCard.html?roll=${item.roll}" class="action-dots" title="View Report Card" style="text-decoration:none;"><i class="ti ti-file-report"></i></a></td>
      </tr>
    `;
  });
  tbody.innerHTML = html;

  const selectAllCb = document.getElementById('selectAllCheckbox');
  const bodyCbs = tbody.querySelectorAll('.checkbox-custom');

  bodyCbs.forEach(cb => {
    cb.addEventListener('click', function () {
      this.classList.toggle('checked');
      const allChecked = Array.from(bodyCbs).every(c => c.classList.contains('checked'));
      if (allChecked) selectAllCb.classList.add('checked');
      else selectAllCb.classList.remove('checked');
    });
  });

  if (selectAllCb) {
    const newSelectAll = selectAllCb.cloneNode(true);
    selectAllCb.parentNode.replaceChild(newSelectAll, selectAllCb);
    
    newSelectAll.addEventListener('click', function () {
      this.classList.toggle('checked');
      const isChecked = this.classList.contains('checked');
      bodyCbs.forEach(cb => {
        if (isChecked) cb.classList.add('checked');
        else cb.classList.remove('checked');
      });
    });
  }
}

document.addEventListener('DOMContentLoaded', renderResults);
</script>
