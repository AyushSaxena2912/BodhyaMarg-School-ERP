<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BodhyaMarg ERP – System Error</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green: #1a7a4a; --green-light: #e6f4ee; --green-dark: #145e38;
  --bg: #f8fafc; --white: #ffffff; --border: #e2e8f0;
  --text: #1e293b; --text-muted: #64748b; --text-hint: #94a3b8;
  --radius: 8px; --radius-lg: 12px;
  --red: #ef4444; --red-light: #fee2e2; --red-dark: #b91c1c;
  --amber: #f59e0b; --amber-light: #fef3c7;
}
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; }

.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 10px 24px; background: var(--white); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.topbar-search { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 12px; width: 280px; }
.topbar-search i { font-size: 14px; color: var(--text-hint); }
.topbar-search input { border: none; background: transparent; font-size: 12.5px; font-family: inherit; outline: none; width: 100%; }
.topbar-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.icon-btn { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius); border: 1px solid var(--border); background: var(--white); cursor: pointer; color: var(--text-muted); }
.av { width: 34px; height: 34px; border-radius: 50%; background: var(--green); color: #fff; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; cursor: pointer; }

.content { flex: 1; overflow-y: auto; padding: 32px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.content::-webkit-scrollbar { width: 4px; }
.content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* Dev Controls Toggle Bar */
.dev-controls { background: var(--white); border: 1px dashed var(--green); border-radius: var(--radius); padding: 8px 16px; display: flex; align-items: center; gap: 12px; margin-bottom: 24px; width: 100%; max-width: 680px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
.dev-label { font-size: 12px; font-weight: 700; color: var(--green); text-transform: uppercase; letter-spacing: 0.05em; display: flex; align-items: center; gap: 6px; }
.dev-btn-group { display: flex; gap: 6px; margin-left: auto; }
.dev-btn { padding: 6px 12px; font-size: 12px; font-weight: 600; border-radius: 6px; border: 1px solid var(--border); background: var(--white); cursor: pointer; color: var(--text-muted); transition: all 0.2s; }
.dev-btn.active { background: var(--green-light); border-color: var(--green); color: var(--green); }

/* Main Card */
.error-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); width: 100%; max-width: 680px; padding: 40px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.025); position: relative; transition: opacity 0.25s, transform 0.25s; }
.error-card.fade-out { opacity: 0; transform: scale(0.98); }

/* Error Art & Animations */
.art-container { height: 160px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; position: relative; }

/* 404 Animation: Floating Search Light & Doc */
.art-404 { display: none; width: 120px; height: 120px; position: relative; }
.art-404 svg { width: 100%; height: 100%; }
.float-doc { animation: floatDoc 3s ease-in-out infinite; transform-origin: center; }
.pulse-light { animation: pulseLight 2s ease-in-out infinite; }

/* 500 Animation: Pulsing Server with glowing lights */
.art-500 { display: none; width: 120px; height: 120px; position: relative; }
.art-500 svg { width: 100%; height: 100%; }
.glitch-server { animation: serverShake 4s infinite; }
.status-led { animation: ledBlink 1s infinite alternate; }

@keyframes floatDoc {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-8px) rotate(2deg); }
}
@keyframes pulseLight {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.85; }
}
@keyframes ledBlink {
  0% { fill: var(--red); filter: drop-shadow(0 0 2px var(--red)); }
  100% { fill: #334155; filter: none; }
}
@keyframes serverShake {
  0%, 95%, 100% { transform: translate(0, 0); }
  96% { transform: translate(-2px, 1px); }
  97% { transform: translate(2px, -1px); }
  98% { transform: translate(-1px, -1px); }
  99% { transform: translate(1px, 2px); }
}

/* Error Headings & Texts */
.error-code { font-size: 14px; font-weight: 700; color: var(--red-dark); text-transform: uppercase; letter-spacing: 0.1em; background: var(--red-light); padding: 4px 12px; border-radius: 20px; display: inline-block; margin-bottom: 16px; }
.error-code.c-404 { color: var(--green-dark); background: var(--green-light); }
.error-title { font-size: 24px; font-weight: 700; color: var(--text); margin-bottom: 12px; }
.error-desc { font-size: 14.5px; color: var(--text-muted); line-height: 1.6; margin-bottom: 30px; max-width: 500px; margin-left: auto; margin-right: auto; }

/* Status Bar Widget */
.status-bar { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 16px 0; margin-bottom: 30px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.status-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.status-label { font-size: 11px; font-weight: 600; color: var(--text-hint); text-transform: uppercase; }
.status-indicator { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.status-dot.ok { background: #10b981; box-shadow: 0 0 6px #10b981; }
.status-dot.warning { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
.status-dot.error { background: var(--red); box-shadow: 0 0 6px var(--red); }

/* Buttons Layout */
.actions-layout { display: flex; align-items: center; justify-content: center; gap: 12px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: var(--radius); font-size: 13.5px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--white); color: var(--text); transition: all 0.2s; outline: none; }
.btn:hover { background: var(--bg); }
.btn-primary { background: var(--green); color: #fff; border-color: var(--green); }
.btn-primary:hover { background: var(--green-dark); }
.btn-danger { background: var(--red); color: #fff; border-color: var(--red); }
.btn-danger:hover { background: var(--red-dark); }

/* Stack Trace Container */
.tech-details-container { margin-top: 24px; text-align: left; }
.tech-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--text-hint); cursor: pointer; user-select: none; transition: color 0.2s; }
.tech-toggle:hover { color: var(--text-muted); }
.tech-toggle i { transition: transform 0.2s; }
.tech-toggle.open i { transform: rotate(90deg); }
.tech-content { display: none; margin-top: 12px; background: #0f172a; color: #94a3b8; border-radius: var(--radius); padding: 16px; position: relative; }
.tech-content pre { font-family: 'Fira Code', monospace; font-size: 11.5px; line-height: 1.6; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
.copy-btn { position: absolute; right: 12px; top: 12px; background: rgba(255,255,255,0.06); border: none; border-radius: 4px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; color: #fff; cursor: pointer; font-size: 13px; transition: background 0.2s; }
.copy-btn:hover { background: rgba(255,255,255,0.15); }

/* Sidebar Active states override */
.sidebar a,.sidebar a:link,.sidebar a:visited,.sidebar a:hover,.sidebar a:active{text-decoration:none!important;color:inherit;}
</style>
</head>
<body>



<!-- MAIN WORKSPACE -->
<div class="main">
  

  <div class="content">
    
    <!-- Dev Switcher Mode -->
    

    <!-- Error Presenter Card -->
    <div class="error-card" id="errorCard">
      
      <!-- Art & Animations -->
      <div class="art-container">
        
        <!-- Case 404 Art -->
        <div class="art-404" id="art404">
          <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="35" y="20" width="50" height="70" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2" class="float-doc"/>
            <line x1="45" y1="40" x2="65" y2="40" stroke="#a7f3d0" stroke-width="2" class="float-doc"/>
            <line x1="45" y1="52" x2="75" y2="52" stroke="#a7f3d0" stroke-width="2" class="float-doc"/>
            <line x1="45" y1="64" x2="60" y2="64" stroke="#a7f3d0" stroke-width="2" class="float-doc"/>
            <!-- Magnifying Glass -->
            <g class="pulse-light">
              <circle cx="78" cy="78" r="16" fill="#f0fdf4" stroke="#10b981" stroke-width="2.5"/>
              <line x1="89" y1="89" x2="105" y2="105" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
            </g>
          </svg>
        </div>

        <!-- Case 500 Art -->
        

        <!-- Case 401/403 Art (Lock/Shield) -->
        

        <!-- Case 503 Art (Settings/Maintenance) -->
        

      </div>

      <!-- Error Content Details -->
      <span class="error-code c-404" style="">Error Code: 404</span>
      <h2 class="error-title">Oops! Page Not Found</h2>
      <p class="error-desc">We couldn't find the page you are looking for. It might have been moved, deleted, or perhaps there is a typo in the web address. Let's get you back to the dashboard.</p>



      <!-- Action Buttons -->
      <div class="actions-layout">
        <button class="btn btn-primary" onclick="goHome()"><i class="ti ti-arrow-left"></i> Back to Dashboard</button>
        <button class="btn" onclick="window.location.reload()"><i class="ti ti-reload"></i> Reload System</button>
      </div>

      

    </div>

  </div>
</div>

<script>
function goHome() {
  window.location.href = "AllStudents.html";
}
</script>

</body>
</html>
