<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BodhyaMarg ERP – Staff Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green: #1a7a4a; --green-light: #e6f4ee; --green-dark: #145e38;
  --bg: #f8fafc; --white: #ffffff; --border: #e2e8f0;
  --text: #1e293b; --text-muted: #64748b; --text-hint: #94a3b8;
  --radius: 8px; --radius-lg: 12px;
}
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; }
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 10px 24px; background: var(--white); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.topbar-search { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 12px; width: 280px; }
.topbar-search i { font-size: 14px; color: var(--text-hint); }
.topbar-search input { border: none; background: transparent; font-size: 12.5px; font-family: inherit; outline: none; width: 100%; }
.topbar-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.icon-btn { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius); border: 1px solid var(--border); background: var(--white); cursor: pointer; color: var(--text-muted); }
.av { width: 34px; height: 34px; border-radius: 50%; background: var(--green); color: #fff; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.content { flex: 1; overflow-y: auto; padding: 24px; }
.content::-webkit-scrollbar { width: 4px; }
.content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
.page-header h1 { font-size: 20px; font-weight: 600; }
.breadcrumb { font-size: 11.5px; color: var(--text-hint); margin-top: 3px; display: flex; align-items: center; gap: 4px; }
.bc-green { color: var(--green); font-weight: 500; }
.page-actions { display: flex; gap: 10px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--white); color: var(--text); transition: all 0.2s; white-space: nowrap; }
.btn:hover { background: var(--bg); }
.btn-primary { background: var(--green); color: #fff; border-color: var(--green); }
.btn-primary:hover { background: var(--green-dark); color: #fff; }

.controls-card { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; background: var(--white); padding: 16px 20px; border-radius: var(--radius-lg); border: 1px solid var(--border); flex-wrap: wrap; gap: 16px; }
.controls-title { font-size: 16px; font-weight: 700; color: var(--text); margin-right: auto; }
.controls-filters { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.input-box { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); padding: 8px 12px; border-radius: var(--radius); font-size: 13px; color: var(--text-muted); background: var(--white); }
.input-box select, .input-box input { border: none; outline: none; background: transparent; font-family: inherit; font-size: 13px; color: var(--text); padding-right: 4px; cursor: pointer; -webkit-appearance: none; appearance: none; }
.input-box input[type="date"] { cursor: text; }
.input-box i { color: var(--text-hint); font-size: 16px; }
.input-box .ti-chevron-down { font-size: 14px; margin-left: -4px; pointer-events: none; }

.table-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.table-toolbar { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
.table-entries { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); }
.table-entries select { padding: 6px 28px 6px 10px; border-radius: var(--radius); border: 1px solid var(--border); outline: none; font-family: inherit; font-size: 13px; }
.table-search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); padding: 6px 12px; border-radius: var(--radius); }
.table-search input { border: none; outline: none; background: transparent; font-size: 13px; font-family: inherit; width: 200px; }

.table-responsive { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 1000px; }
thead tr { background: #f8fafc; border-bottom: 1px solid var(--border); }
thead th { padding: 14px 20px; font-size: 12px; font-weight: 600; color: var(--text-muted); text-align: left; white-space: nowrap; }
tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: #f8fafc; }
tbody td { padding: 14px 20px; font-size: 13.5px; color: var(--text); vertical-align: middle; }

.checkbox-cell { width: 48px; }
.checkbox-custom { width: 18px; height: 18px; border: 1.5px solid var(--text-hint); border-radius: 4px; display: inline-block; cursor: pointer; position: relative; }
.checkbox-custom.checked { background: var(--green); border-color: var(--green); }
.checkbox-custom.checked::after { content: ''; position: absolute; left: 5px; top: 2px; width: 5px; height: 10px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }

.staff-info { display: flex; align-items: center; gap: 12px; }
.staff-av { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px; }
.staff-name { font-weight: 600; }
.staff-id { font-size: 11px; color: var(--text-hint); margin-top: 2px; }

/* Attendance Radios */
.att-options { display: flex; gap: 6px; }
.att-radio { display: none; }
.att-label { padding: 5px 12px; border-radius: 20px; font-size: 11.5px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); color: var(--text-muted); background: var(--white); transition: all 0.2s; user-select: none; }
.att-label:hover { background: var(--bg); }
.att-radio[value="present"]:checked + .att-label { background: #ecfdf5; color: #10b981; border-color: #10b981; }
.att-radio[value="absent"]:checked + .att-label { background: #fef2f2; color: #ef4444; border-color: #ef4444; }
.att-radio[value="late"]:checked + .att-label { background: #fffbeb; color: #f59e0b; border-color: #f59e0b; }
.att-radio[value="halfday"]:checked + .att-label { background: #f0fdfa; color: #0d9488; border-color: #0d9488; }
.att-radio[value="holiday"]:checked + .att-label { background: #f1f5f9; color: #475569; border-color: #475569; }

.remark-input { width: 100%; border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; font-size: 12.5px; font-family: inherit; outline: none; transition: border 0.2s; }
.remark-input:focus { border-color: var(--green); }

/* Pagination */
.pagination { padding: 16px 20px; display: flex; align-items: center; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--border); }
.page-link { display: flex; align-items: center; justify-content: center; min-width: 34px; height: 34px; padding: 0 8px; border-radius: 6px; font-size: 14px; font-weight: 500; color: var(--text-muted); cursor: pointer; transition: all 0.2s; text-decoration: none; }
.page-link:hover { background: var(--bg); }
.page-link.active { background: var(--green); color: #ffffff; border-radius: 8px; }
.page-link.text-link { color: var(--text-hint); font-size: 14px; background: transparent; }
.page-link.text-link:hover { color: var(--text); }
</style>
<style>
.sidebar a,.sidebar a:link,.sidebar a:visited,.sidebar a:hover,.sidebar a:active{text-decoration:none!important;color:inherit;}
</style>
<script src="permissions.js"></script>
<script>BodhyaAuth.guardPage(['admin', 'staff']);</script>
</head>
<body>
<div id="sidebar-container"></div>
<div class="main">
  <div class="topbar">
    <div class="topbar-search"><i class="ti ti-search"></i><input type="text" placeholder="Search..." /></div>
    <div class="topbar-right">
      <div class="icon-btn"><i class="ti ti-bell" style="font-size:16px;"></i></div>
      <div class="icon-btn"><i class="ti ti-settings" style="font-size:16px;"></i></div>
      <div class="av">AD</div>
    </div>
  </div>
  <div class="content">
    <div class="page-header">
      <div>
        <h1>Staff Attendance</h1>
        <div class="breadcrumb">
          Dashboard <i class="ti ti-chevron-right" style="font-size:10px;"></i>
          HRM <i class="ti ti-chevron-right" style="font-size:10px;"></i>
          <span class="bc-green">Staff Attendance</span>
        </div>
      </div>
      <div class="page-actions">
        <button class="btn btn-primary"><i class="ti ti-device-floppy" style="font-size:15px;"></i> Save Attendance</button>
      </div>
    </div>

    <!-- Filters -->
    <div class="controls-card">
      <div class="controls-title">Mark Attendance</div>
      <div class="controls-filters">
        <div class="input-box"><i class="ti ti-calendar"></i>
          <input type="date" value="2026-05-27" />
        </div>
        <div class="input-box"><i class="ti ti-sitemap"></i>
          <select id="filterDepartment">
            <!-- Populated dynamically -->
          </select><i class="ti ti-chevron-down"></i>
        </div>
        <div class="input-box"><i class="ti ti-activity"></i>
          <select id="filterStatus">
            <option selected>All Statuses</option>
            <option value="present">Present</option>
            <option value="absent">Absent</option>
            <option value="late">Late</option>
            <option value="halfday">Half Day</option>
            <option value="holiday">Holiday</option>
          </select><i class="ti ti-chevron-down"></i>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="table-card">
      <div class="table-toolbar">
        <div class="table-entries">Row Per Page <select><option>10</option><option>25</option><option>50</option></select> Entries</div>
        
        <div style="display:flex; gap:10px; align-items:center;">
          <button class="btn" onclick="markAll('present')" style="font-size:12px; padding:6px 12px; color:#10b981;"><i class="ti ti-check"></i> Mark All Present</button>
          <div class="table-search"><input type="text" id="searchStaffInput" placeholder="Search Staff..." /></div>
        </div>
      </div>
      <div class="table-responsive">
        <table>
          <thead><tr>
            <th class="checkbox-cell"><div class="checkbox-custom" id="selectAllCheckbox"></div></th>
            <th>Staff Details</th>
            <th>Department & Role</th>
            <th>Attendance Status</th>
            <th style="width:250px;">Remarks</th>
          </tr></thead>
          <tbody id="attendanceBody"></tbody>
        </table>
      </div>
      <div class="pagination">
        <a href="#" class="page-link text-link">Prev</a>
        <a href="#" class="page-link active">1</a>
        <a href="#" class="page-link text-link">Next</a>
      </div>
    </div>
  </div>
</div>

<script>
const staffData = [
  { empId: 'STF-001', name: 'Ramesh Patel', deptRole: 'Security / Head Guard', status: 'present', remarks: '' },
  { empId: 'STF-002', name: 'Manoj Tiwari', deptRole: 'Maintenance / Plumber', status: 'present', remarks: '' },
  { empId: 'STF-003', name: 'Sunita Devi', deptRole: 'Cleaning / Sweeper', status: 'absent', remarks: 'Sick leave' },
  { empId: 'STF-004', name: 'Prakash Rao', deptRole: 'Transport / Driver', status: 'late', remarks: 'Bus breakdown' },
  { empId: 'STF-005', name: 'Anita Singh', deptRole: 'Admin / Receptionist', status: 'present', remarks: '' },
  { empId: 'STF-006', name: 'Raju Bhai', deptRole: 'Canteen / Chef', status: 'halfday', remarks: 'Personal work' },
  { empId: 'STF-007', name: 'Deepak Kumar', deptRole: 'IT Support / Technician', status: 'present', remarks: '' },
  { empId: 'STF-008', name: 'Rekha Sharma', deptRole: 'Cleaning / Sweeper', status: 'holiday', remarks: 'Weekly off' }
];

function getInitials(name) {
  return name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
}

function getAvColor(status) {
  if (status === 'present') return { bg: '#ecfdf5', text: '#10b981' };
  if (status === 'absent')  return { bg: '#fef2f2', text: '#ef4444' };
  if (status === 'late')    return { bg: '#fffbeb', text: '#f59e0b' };
  if (status === 'holiday') return { bg: '#f1f5f9', text: '#475569' };
  return { bg: '#f0fdfa', text: '#0d9488' }; // halfday
}

function populateDepartments() {
  const select = document.getElementById('filterDepartment');
  const depts = new Set();
  staffData.forEach(s => {
    const dept = s.deptRole.split(' / ')[0].trim();
    depts.add(dept);
  });
  
  let html = '<option selected>All Departments</option>';
  Array.from(depts).sort().forEach(dept => {
    html += `<option>${dept}</option>`;
  });
  select.innerHTML = html;
}

function getFilteredData() {
  const deptFilter = document.getElementById('filterDepartment').value;
  const statusFilter = document.getElementById('filterStatus').value;
  const searchQuery = document.getElementById('searchStaffInput').value.toLowerCase().trim();

  return staffData.filter(s => {
    // 1. Department Filter
    if (deptFilter !== 'All Departments') {
      const dept = s.deptRole.split(' / ')[0].trim();
      if (dept !== deptFilter) return false;
    }

    // 2. Status Filter
    if (statusFilter !== 'All Statuses') {
      if (s.status !== statusFilter) return false;
    }

    // 3. Search Query
    if (searchQuery) {
      const matchesName = s.name.toLowerCase().includes(searchQuery);
      const matchesId = s.empId.toLowerCase().includes(searchQuery);
      const matchesDeptRole = s.deptRole.toLowerCase().includes(searchQuery);
      if (!matchesName && !matchesId && !matchesDeptRole) return false;
    }

    return true;
  });
}

function render() {
  const tbody = document.getElementById('attendanceBody');
  const filtered = getFilteredData();
  let html = '';

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--text-muted);"><i class="ti ti-users-minus" style="font-size:24px;display:block;margin-bottom:8px;"></i>No staff members found matching the criteria.</td></tr>`;
    document.getElementById('selectAllCheckbox').classList.remove('checked');
    return;
  }

  filtered.forEach(item => {
    let av = getAvColor(item.status);
    
    html += `
      <tr>
        <td class="checkbox-cell"><div class="checkbox-custom" data-id="${item.empId}"></div></td>
        <td>
          <div class="staff-info">
            <div class="staff-av" style="background:${av.bg};color:${av.text};width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;">${getInitials(item.name)}</div>
            <div>
              <div class="staff-name" style="font-weight:600;">${item.name}</div>
              <div class="staff-id" style="font-size:11px;color:var(--text-hint);margin-top:2px;">Emp ID: ${item.empId}</div>
            </div>
          </div>
        </td>
        <td style="color:var(--text-muted);font-weight:500;">${item.deptRole}</td>
        <td>
          <div class="att-options">
            <label>
              <input type="radio" class="att-radio" name="att_${item.empId}" value="present" ${item.status === 'present' ? 'checked' : ''} onchange="updateRowColor(this, '${item.empId}')">
              <span class="att-label">Present</span>
            </label>
            <label>
              <input type="radio" class="att-radio" name="att_${item.empId}" value="absent" ${item.status === 'absent' ? 'checked' : ''} onchange="updateRowColor(this, '${item.empId}')">
              <span class="att-label">Absent</span>
            </label>
            <label>
              <input type="radio" class="att-radio" name="att_${item.empId}" value="late" ${item.status === 'late' ? 'checked' : ''} onchange="updateRowColor(this, '${item.empId}')">
              <span class="att-label">Late</span>
            </label>
            <label>
              <input type="radio" class="att-radio" name="att_${item.empId}" value="halfday" ${item.status === 'halfday' ? 'checked' : ''} onchange="updateRowColor(this, '${item.empId}')">
              <span class="att-label">Half Day</span>
            </label>
            <label>
              <input type="radio" class="att-radio" name="att_${item.empId}" value="holiday" ${item.status === 'holiday' ? 'checked' : ''} onchange="updateRowColor(this, '${item.empId}')">
              <span class="att-label">Holiday</span>
            </label>
          </div>
        </td>
        <td><input type="text" class="remark-input" placeholder="Add remark..." value="${item.remarks}" onchange="updateRemark('${item.empId}', this.value)"></td>
      </tr>
    `;
  });

  tbody.innerHTML = html;

  const selectAllCb = document.getElementById('selectAllCheckbox');
  const bodyCbs = tbody.querySelectorAll('.checkbox-custom');

  bodyCbs.forEach(cb => {
    cb.addEventListener('click', function () { 
      this.classList.toggle('checked'); 
      const allChecked = Array.from(bodyCbs).every(c => c.classList.contains('checked'));
      if (allChecked) selectAllCb.classList.add('checked');
      else selectAllCb.classList.remove('checked');
    });
  });

  if (selectAllCb) {
    const newSelectAll = selectAllCb.cloneNode(true);
    selectAllCb.parentNode.replaceChild(newSelectAll, selectAllCb);
    
    newSelectAll.addEventListener('click', function () {
      this.classList.toggle('checked');
      const isChecked = this.classList.contains('checked');
      bodyCbs.forEach(cb => {
        if (isChecked) cb.classList.add('checked');
        else cb.classList.remove('checked');
      });
    });
  }
}

window.updateRowColor = function(radio, empId) {
  const tr = radio.closest('tr');
  const avDiv = tr.querySelector('.staff-av');
  const colors = getAvColor(radio.value);
  avDiv.style.background = colors.bg;
  avDiv.style.color = colors.text;
  
  const staff = staffData.find(s => s.empId === empId);
  if (staff) staff.status = radio.value;
}

window.updateRemark = function(empId, value) {
  const staff = staffData.find(s => s.empId === empId);
  if (staff) staff.remarks = value;
}

window.markAll = function(status) {
  const filtered = getFilteredData();
  filtered.forEach(s => {
    s.status = status;
  });
  render();
}

document.addEventListener('DOMContentLoaded', () => {
  populateDepartments();
  render();

  document.getElementById('filterDepartment').addEventListener('change', render);
  document.getElementById('filterStatus').addEventListener('change', render);
  document.getElementById('searchStaffInput').addEventListener('input', render);
});
</script>
<script src="sidebar.js"></script>
</body>
</html>
