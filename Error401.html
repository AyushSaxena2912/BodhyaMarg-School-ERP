<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Session Expired - BodhyaMarg ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<style>
  :root {
    --green: #0b7b3f; 
    --green-dark: #096332;
    --text-main: #1e3a5f;
    --text-muted: #64748b;
    --bg-color: #f8fafc;
    --white: #ffffff;
    --border: #e2e8f0;
    --red: #ef4444; 
    --red-light: #fee2e2; 
    --red-dark: #b91c1c;
    --amber: #f59e0b; 
    --amber-light: #fef3c7;
    --blue: #2563eb;
    --blue-light: #eff6ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-color);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  
  /* Header Section (Same as Login) */
  .header {
    background-color: var(--green);
    color: var(--white);
    padding: 16px 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .school-logo { width: 65px; height: auto; }
  .school-titles { display: flex; flex-direction: column; justify-content: center; }
  .school-name { font-size: 24px; font-weight: 600; letter-spacing: 0.5px; line-height: 1.2; }
  .school-sub { font-size: 12px; font-weight: 600; margin-top: 2px; }
  .school-sub2 { font-size: 10px; font-weight: 400; margin-top: 1px; opacity: 0.9; }
  .header-nav { display: flex; gap: 32px; }
  .header-nav a { color: var(--white); text-decoration: none; font-size: 15px; font-weight: 600; transition: opacity 0.2s; }
  .header-nav a:hover { opacity: 0.8; }
  
  /* Main Content Layout */
  .main-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }
  .error-wrapper {
    display: flex;
    max-width: 1050px;
    width: 100%;
    gap: 48px;
    align-items: stretch;
  }
  
  /* Left Art Banner Section */
  .banner-section {
    flex: 1.1;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .banner-section svg {
    width: 60%;
    height: auto;
    filter: drop-shadow(0 20px 30px rgba(0,0,0,0.1));
  }
  
  /* Right Error Details Section */
  .error-section {
    flex: 0.9;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 480px;
  }
  .error-card {
    background: var(--white);
    padding: 48px;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.04);
    border: 1px solid rgba(0,0,0,0.02);
  }
  .error-code {
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 6px 14px;
    border-radius: 20px;
    display: inline-block;
    margin-bottom: 24px;
    background: var(--amber-light);
    color: var(--amber);
  }
  .error-title {
    font-size: 32px;
    font-weight: 800;
    color: var(--text-main);
    margin-bottom: 16px;
    line-height: 1.1;
  }
  .error-desc {
    font-size: 15px;
    color: var(--text-muted);
    line-height: 1.6;
    margin-bottom: 32px;
  }
  
  /* Buttons Layout */
  .actions-layout {
    display: flex;
    gap: 12px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    border-radius: 6px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--white);
    color: var(--text-main);
    transition: all 0.2s;
    outline: none;
    text-decoration: none;
  }
  .btn:hover { background: var(--bg-color); border-color: #cbd5e1; }
  .btn-primary { background: var(--green); color: var(--white); border-color: var(--green); }
  .btn-primary:hover { background: var(--green-dark); border-color: var(--green-dark); color: var(--white); }

  .powered-by {
    text-align: center;
    margin-top: 32px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-main);
  }
  .powered-by span { color: var(--green); }

  /* Tech Stack Trace for 500 */
  .tech-details-container { margin-top: 24px; }
  .tech-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #94a3b8; cursor: pointer; user-select: none; transition: color 0.2s; }
  .tech-toggle:hover { color: var(--text-muted); }
  .tech-toggle i { transition: transform 0.2s; }
  .tech-toggle.open i { transform: rotate(90deg); }
  .tech-content { display: none; margin-top: 12px; background: #0f172a; color: #94a3b8; border-radius: 8px; padding: 16px; position: relative; }
  .tech-content pre { font-family: 'Fira Code', monospace; font-size: 12px; line-height: 1.6; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }

  /* SVG Animations */
  .float-doc { animation: floatDoc 3s ease-in-out infinite; transform-origin: center; }
  .pulse-light { animation: pulseLight 2s ease-in-out infinite; }
  .glitch-server { animation: serverShake 4s infinite; }
  .status-led { animation: ledBlink 1s infinite alternate; }
  
  @keyframes floatDoc { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-12px) rotate(3deg); } }
  @keyframes pulseLight { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.85; } }
  @keyframes ledBlink { 0% { fill: var(--red); filter: drop-shadow(0 0 4px var(--red)); } 100% { fill: #334155; filter: none; } }
  @keyframes serverShake { 0%, 95%, 100% { transform: translate(0, 0); } 96% { transform: translate(-3px, 1px); } 97% { transform: translate(3px, -1px); } 98% { transform: translate(-2px, -2px); } 99% { transform: translate(2px, 3px); } }

  /* Responsive Adjustments */
  @media (max-width: 900px) {
    .error-wrapper { flex-direction: column; max-width: 500px; }
    .header { flex-direction: column; gap: 20px; padding: 16px 20px; text-align: center; }
    .header-nav { gap: 16px; }
    .school-titles { align-items: center; }
    .banner-section { padding: 60px 20px; }
    .banner-section svg { width: 140px; }
  }
</style>
</head>
<body>

  <!-- Header Section -->
  <header class="header">
    <div class="header-left">
      <img src="school_logo.png" alt="DPS Logo" class="school-logo" onerror="this.src='https://via.placeholder.com/65x80?text=Logo'" />
      <div class="school-titles">
        <div class="school-name">DELHI PUBLIC SCHOOL</div>
        <div class="school-sub">Greater Faridabad</div>
        <div class="school-sub2">(Under the agencies of The DPS Society)</div>
      </div>
    </div>
    <nav class="header-nav">
      <a href="Login.html">Login</a>
      <a href="#">About</a>
      <a href="#">Academics</a>
    </nav>
  </header>

  <!-- Main Content Layout -->
  <main class="main-container">
    <div class="error-wrapper">
      
      <!-- Left Art Banner Section -->
      <div class="banner-section">
        
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Large Shield/Lock combo -->
            <path d="M60 15C42 15 35 32 35 45V55H85V45C85 32 78 15 60 15Z" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
            <rect x="25" y="55" width="70" height="50" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="5"/>
            <circle cx="60" cy="78" r="7" fill="#d97706"/>
            <path d="M60 85V92" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
        </svg>
    
      </div>

      <!-- Right Error Details Section -->
      <div class="error-section">
        <div class="error-card">
          <span class="error-code">Error Code: 401 UNAUTHORIZED</span>
          <h1 class="error-title">Session Expired</h1>
          <p class="error-desc">Your session has expired or you need to login again to view this page. Please re-authenticate.</p>
          
          <div class="actions-layout">
            <button class="btn btn-primary" onclick="window.location.href='AllStudents.html'"><i class="ti ti-arrow-left"></i> Dashboard</button>
            <button class="btn" onclick="window.location.href='Login.html'"><i class="ti ti-login"></i> Login Again</button>
          </div>

          
        </div>
        
        <div class="powered-by">
          Powered By <span>BodhyaMarg</span>
        </div>
      </div>

    </div>
  </main>

  <script>
    function toggleTechTrace() {
      const toggle = document.querySelector('.tech-toggle');
      const content = document.querySelector('.tech-content');
      toggle.classList.toggle('open');
      content.style.display = toggle.classList.contains('open') ? 'block' : 'none';
    }
  </script>
</body>
</html>
