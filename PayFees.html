<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BodhyaMarg ERP – Pay Fees</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --primary: #1a7a4a; --primary-light: #e6f4ee; --primary-dark: #145e38; --bg: #f4f6f8; --surface: #ffffff; --border: #e2e6ea; --text-main: #1a1d23; --text-muted: #6b7280; --text-hint: #9ca3af; --radius: 8px; --radius-lg: 12px; --shadow: 0 4px 12px rgba(0,0,0,0.05); }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; }
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 24px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.topbar-search { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 12px; width: 280px; }
.topbar-search i { font-size: 14px; color: var(--text-hint); } .topbar-search input { border: none; background: transparent; font-size: 13px; outline: none; width: 100%; }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.icon-btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); cursor: pointer; color: var(--text-muted); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.content { flex: 1; overflow-y: auto; padding: 24px; }
.content::-webkit-scrollbar { width: 6px; } .content::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; }
.page-header { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-start; }
.page-title h1 { font-size: 22px; font-weight: 700; color: var(--text-main); }
.breadcrumb { font-size: 12px; color: var(--text-hint); margin-top: 4px; display: flex; align-items: center; gap: 4px; font-weight: 500; } .breadcrumb span { color: var(--primary); }

.summary-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 30px; }
.summary-card { background: var(--surface); border-radius: var(--radius-lg); padding: 20px; border: 1px solid var(--border); box-shadow: var(--shadow); display: flex; align-items: center; gap: 16px; }
.summary-card .icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
.summary-card .icon.red { background: #fef2f2; color: #ef4444; }
.summary-card .icon.green { background: #f0fdf4; color: #22c55e; }
.summary-card .details h3 { font-size: 13px; color: var(--text-muted); font-weight: 600; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.summary-card .details .amount { font-size: 24px; font-weight: 700; color: var(--text-main); }

.tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
.tab { padding: 10px 4px; font-size: 14px; font-weight: 600; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }

.fee-list { display: flex; flex-direction: column; gap: 16px; }
.fee-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); }
.fee-info { display: flex; gap: 16px; align-items: center; }
.fee-icon { width: 44px; height: 44px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 20px; }
.fee-details h4 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.fee-details p { font-size: 13px; color: var(--text-muted); }
.fee-meta { display: flex; align-items: center; gap: 12px; margin-top: 6px; font-size: 12px; }
.fee-meta span { display: inline-flex; align-items: center; gap: 4px; color: var(--text-muted); background: var(--bg); padding: 4px 8px; border-radius: 4px; }
.fee-meta span.due-urgent { background: #fef2f2; color: #ef4444; }
.fee-action { text-align: right; }
.fee-action .amt { font-size: 20px; font-weight: 700; color: var(--text-main); margin-bottom: 10px; display: block; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; border: none; outline: none; transition: 0.2s; }
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
.btn-outline:hover { background: var(--bg); }

/* Status Badges */
.status { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 20px; }
.status.paid { background: #dcfce7; color: #166534; }
.status.pending { background: #fef9c3; color: #854d0e; }

/* Payment Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.2s; }
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal { background: var(--surface); border-radius: var(--radius-lg); width: 400px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
.modal-header { font-size: 18px; font-weight: 700; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
.modal-header i { cursor: pointer; color: var(--text-muted); }
.gateway-options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
.gateway-option { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: 0.2s; }
.gateway-option:hover { border-color: var(--primary); background: var(--primary-light); }
.gateway-option img { height: 24px; object-fit: contain; }
.gateway-option input[type="radio"] { accent-color: var(--primary); width: 16px; height: 16px; }

.empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
.empty-state i { font-size: 48px; color: var(--text-hint); margin-bottom: 16px; }
</style>
</head>
<body>
<div id="sidebar-container"></div>
<div class="main">
  <div class="topbar">
    <div class="topbar-search"><i class="ti ti-search"></i><input type="text" placeholder="Search..." /></div>
    <div class="topbar-right">
      <div class="icon-btn"><i class="ti ti-bell"></i></div>
      <div class="avatar">U</div>
    </div>
  </div>
  <div class="content">
    <div class="page-header">
      <div class="page-title">
        <h1>My Finance & Fees</h1>
        <div class="breadcrumb">Dashboard <i class="ti ti-chevron-right"></i> My Finance <i class="ti ti-chevron-right"></i> <span>Pay Fees</span></div>
      </div>
    </div>
    
    <div class="summary-cards">
      <div class="summary-card">
        <div class="icon red"><i class="ti ti-coin"></i></div>
        <div class="details">
          <h3>Total Due</h3>
          <div class="amount" id="totalDue">₹0</div>
        </div>
      </div>
      <div class="summary-card">
        <div class="icon green"><i class="ti ti-receipt-2"></i></div>
        <div class="details">
          <h3>Total Paid</h3>
          <div class="amount" id="totalPaid">₹0</div>
        </div>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('pending')" id="tab-pending">Pending Dues</div>
      <div class="tab" onclick="switchTab('paid')" id="tab-paid">Payment History</div>
    </div>

    <div class="fee-list" id="feeList">
      <!-- List injected by JS -->
    </div>

  </div>
</div>

<div class="modal-overlay" id="paymentModal">
  <div class="modal">
    <div class="modal-header">
      Select Payment Method
      <i class="ti ti-x" onclick="closePaymentModal()"></i>
    </div>
    <div class="gateway-options">
      <label class="gateway-option">
        <img src="Razorpay.png" alt="Razorpay" onerror="this.src=''; this.alt='Razorpay'">
        <input type="radio" name="gateway" checked>
      </label>
      <label class="gateway-option">
        <img src="Stripe.png" alt="Stripe" onerror="this.src=''; this.alt='Stripe'">
        <input type="radio" name="gateway">
      </label>
      <label class="gateway-option">
        <img src="Cashfree.png" alt="Cashfree" onerror="this.src=''; this.alt='Cashfree'">
        <input type="radio" name="gateway">
      </label>
    </div>
    <button class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; font-size: 15px;" onclick="processPayment()">
      Pay <span id="payAmountTxt"></span> Now
    </button>
  </div>
</div>

<script>
// Mock data linking roles to fees
let mockFees = [
  // Student fees
  { id: 1, role: 'student', title: '1st Instalment - Academic Fees', group: 'Academic Fees', amount: 36315, dueDate: '2026-04-15', status: 'pending', icon: 'ti-book' },
  { id: 2, role: 'student', title: 'Bus Fee (April - June)', group: 'Transport Fees', amount: 4500, dueDate: '2026-04-10', status: 'pending', icon: 'ti-bus' },
  { id: 3, role: 'student', title: 'Admission Fee', group: 'Academic Fees', amount: 7265, dueDate: '2026-03-01', status: 'paid', icon: 'ti-school' },
  // Teacher fees
  { id: 4, role: 'teacher', title: 'Staff Transport Fee (Q1)', group: 'Transport Fees', amount: 2500, dueDate: '2026-04-10', status: 'pending', icon: 'ti-bus' },
  { id: 5, role: 'teacher', title: 'Staff Transport Fee (Q4)', group: 'Transport Fees', amount: 2500, dueDate: '2026-01-10', status: 'paid', icon: 'ti-bus' },
  // Staff fees
  { id: 6, role: 'staff', title: 'Transport Fee (Q1)', group: 'Transport Fees', amount: 1500, dueDate: '2026-04-10', status: 'pending', icon: 'ti-bus' },
  // Parent fees (will just show student fees for demo)
];

let currentTab = 'pending';
let activePaymentId = null;
let currentRole = localStorage.getItem('bodhya_user_role') || 'student';
// Treat parent same as student for fee viewing in this mock
let roleToFilter = currentRole === 'parent' ? 'student' : currentRole.toLowerCase();
// If admin/superadmin lands here, just show student fees to not break the UI
if(['admin','superadmin'].includes(roleToFilter)) roleToFilter = 'student';

function renderFees() {
  const filteredFees = mockFees.filter(f => f.role === roleToFilter && f.status === currentTab);
  const container = document.getElementById('feeList');
  
  if (filteredFees.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <i class="ti ti-mood-smile"></i>
        <h2>No ${currentTab} fees found</h2>
        <p>You have no ${currentTab} dues at the moment.</p>
      </div>`;
    updateSummaries();
    return;
  }

  container.innerHTML = filteredFees.map(f => {
    const isOverdue = new Date(f.dueDate) < new Date() && f.status === 'pending';
    return `
      <div class="fee-item">
        <div class="fee-info">
          <div class="fee-icon"><i class="ti ${f.icon}"></i></div>
          <div class="fee-details">
            <h4>${f.title}</h4>
            <p>${f.group}</p>
            <div class="fee-meta">
              <span class="${isOverdue ? 'due-urgent' : ''}"><i class="ti ti-calendar-due"></i> Due: ${f.dueDate}</span>
              ${f.status === 'paid' ? `<span style="color:#166534"><i class="ti ti-check"></i> Paid on ${f.dueDate}</span>` : ''}
            </div>
          </div>
        </div>
        <div class="fee-action">
          <span class="amt">₹${f.amount.toLocaleString('en-IN')}</span>
          ${f.status === 'pending' 
            ? `<button class="btn btn-primary" onclick="openPaymentModal(${f.id}, ${f.amount})">Pay Now</button>`
            : `<span class="status paid"><i class="ti ti-circle-check-filled"></i> Paid</span> <button class="btn btn-outline" style="margin-left: 8px;"><i class="ti ti-download"></i> Receipt</button>`
          }
        </div>
      </div>
    `;
  }).join('');
  
  updateSummaries();
}

function updateSummaries() {
  const myFees = mockFees.filter(f => f.role === roleToFilter);
  const totalDue = myFees.filter(f => f.status === 'pending').reduce((sum, f) => sum + f.amount, 0);
  const totalPaid = myFees.filter(f => f.status === 'paid').reduce((sum, f) => sum + f.amount, 0);
  document.getElementById('totalDue').textContent = `₹${totalDue.toLocaleString('en-IN')}`;
  document.getElementById('totalPaid').textContent = `₹${totalPaid.toLocaleString('en-IN')}`;
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-pending').classList.toggle('active', tab === 'pending');
  document.getElementById('tab-paid').classList.toggle('active', tab === 'paid');
  renderFees();
}

function openPaymentModal(id, amount) {
  activePaymentId = id;
  document.getElementById('payAmountTxt').textContent = `₹${amount.toLocaleString('en-IN')}`;
  document.getElementById('paymentModal').classList.add('open');
}

function closePaymentModal() {
  document.getElementById('paymentModal').classList.remove('open');
  activePaymentId = null;
}

function processPayment() {
  const fee = mockFees.find(f => f.id === activePaymentId);
  if (fee) {
    fee.status = 'paid';
    fee.dueDate = new Date().toISOString().split('T')[0]; // Set paid date to today
    closePaymentModal();
    renderFees();
    alert("Payment Successful! Mock payment gateway simulation complete.");
  }
}

// Initial render
renderFees();
</script>
<script src="sidebar.js"></script>
</body>
</html>
