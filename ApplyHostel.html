<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BodhyaMarg ERP – Apply for Hostel</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --green: #1a7a4a; --green-light: #e6f4ee; --green-dark: #145e38; --bg: #f4f6f8; --white: #ffffff; --border: #e2e6ea; --text: #1a1d23; --text-muted: #6b7280; --text-hint: #9ca3af; --radius: 8px; --radius-lg: 12px; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; }
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 10px 24px; background: var(--white); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.topbar-search { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 12px; width: 280px; }
.topbar-search i { font-size: 14px; color: var(--text-hint); } .topbar-search input { border: none; background: transparent; font-size: 12.5px; font-family: inherit; outline: none; width: 100%; }
.topbar-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.icon-btn { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius); border: 1px solid var(--border); background: var(--white); cursor: pointer; color: var(--text-muted); }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--green); color: #fff; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.content { flex: 1; overflow-y: auto; padding: 24px; }
.content::-webkit-scrollbar { width: 4px; } .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 24px; }
.page-header h1 { font-size: 20px; font-weight: 600; }
.breadcrumb { font-size: 11.5px; color: var(--text-hint); margin-top: 3px; display: flex; align-items: center; gap: 4px; } .breadcrumb span { color: var(--green); }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius); font-size: 12.5px; font-weight: 500; font-family: inherit; cursor: pointer; border: 1px solid var(--border); background: var(--white); color: var(--text); white-space: nowrap; }
.btn:hover { background: var(--bg); } .btn-primary { background: var(--green); color: #fff; border-color: var(--green); } .btn-primary:hover { background: var(--green-dark); }
.btn-lg { padding: 12px 24px; font-size: 14px; }

/* Hostel Cards */
.hostels-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; margin-bottom: 24px; }
.hostel-card { background: var(--white); border: 2px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; cursor: pointer; transition: all .2s; }
.hostel-card:hover { border-color: var(--green); box-shadow: 0 4px 20px rgba(0,0,0,.06); }
.hostel-card.selected { border-color: var(--green); background: var(--green-light); }
.hostel-banner { height: 100px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
.hostel-banner.boys { background: linear-gradient(135deg, #dbeafe, #bfdbfe); color: #2563eb; }
.hostel-banner.girls { background: linear-gradient(135deg, #fce7f3, #fbcfe8); color: #db2777; }
.hostel-info { padding: 16px; }
.hostel-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.hostel-type { font-size: 11.5px; color: var(--text-muted); margin-bottom: 12px; }
.hostel-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.hs-item { text-align: center; padding: 8px; background: var(--bg); border-radius: 6px; }
.hs-val { font-size: 16px; font-weight: 700; color: var(--green); }
.hs-label { font-size: 10px; color: var(--text-hint); margin-top: 2px; }

/* Room Type Cards */
.rooms-section { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 24px; display: none; }
.rooms-section.show { display: block; }
.rooms-section h3 { font-size: 15px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.rooms-section h3 i { color: var(--green); }
.rooms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.room-card { border: 2px solid var(--border); border-radius: var(--radius); padding: 16px; text-align: center; cursor: pointer; transition: all .2s; }
.room-card:hover { border-color: var(--green); }
.room-card.selected { border-color: var(--green); background: var(--green-light); }
.room-icon { font-size: 28px; color: var(--green); margin-bottom: 8px; }
.room-type { font-size: 13px; font-weight: 600; }
.room-beds { font-size: 11px; color: var(--text-muted); margin: 4px 0; }
.room-price { font-size: 16px; font-weight: 700; color: var(--green); }
.room-price span { font-size: 11px; color: var(--text-hint); font-weight: 400; }

/* Form */
.form-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; display: none; }
.form-card.show { display: block; }
.form-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
.form-card h3 i { color: var(--green); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-field { display: flex; flex-direction: column; gap: 5px; }
.form-field.full { grid-column: 1 / -1; }
.form-field label { font-size: 11.5px; font-weight: 500; color: var(--text-muted); }
.form-field input, .form-field select, .form-field textarea { font-family: inherit; font-size: 12.5px; border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; outline: none; }
.form-field input:focus, .form-field select:focus, .form-field textarea:focus { border-color: var(--green); }
.form-field textarea { resize: vertical; min-height: 70px; }
.form-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
</style>
</head>
<body>
<div id="sidebar-container"></div>
<div class="main">
  <div class="topbar"><div class="topbar-search"><i class="ti ti-search"></i><input placeholder="Search anything…" /></div><div class="topbar-right"><div class="icon-btn"><i class="ti ti-bell"></i></div><div class="avatar">S</div></div></div>
  <div class="content">
    <div class="page-header">
      <div><h1>Apply for Hostel</h1><div class="breadcrumb">Dashboard <i class="ti ti-chevron-right"></i> Hostel <i class="ti ti-chevron-right"></i> <span>Apply for Hostel</span></div></div>
    </div>

    <div class="hostels-grid" id="hostelsGrid"></div>

    <div class="rooms-section" id="roomsSection">
      <h3><i class="ti ti-bed"></i> Select Room Type</h3>
      <div class="rooms-grid" id="roomsGrid"></div>
    </div>

    <div class="form-card" id="formCard">
      <h3><i class="ti ti-forms"></i> Application Details</h3>
      <div class="form-grid">
        <div class="form-field"><label>Student Name</label><input value="Aarav Sharma" readonly /></div>
        <div class="form-field"><label>Class / Section</label><input value="VIII - A" readonly /></div>
        <div class="form-field"><label>Selected Hostel</label><input id="selHostel" readonly /></div>
        <div class="form-field"><label>Room Type</label><input id="selRoom" readonly /></div>
        <div class="form-field"><label>Guardian Contact</label><input value="9876543210" readonly /></div>
        <div class="form-field"><label>Food Preference</label><select><option>Vegetarian</option><option>Non-Vegetarian</option></select></div>
        <div class="form-field full"><label>Medical Conditions / Allergies</label><textarea placeholder="Any medical conditions or dietary restrictions…"></textarea></div>
        <div class="form-field full"><label>Additional Notes</label><textarea placeholder="Any special requests…"></textarea></div>
      </div>
      <div class="form-footer">
        <button class="btn">Cancel</button>
        <button class="btn btn-primary btn-lg" onclick="submitApp()"><i class="ti ti-send"></i> Submit Application</button>
      </div>
    </div>
  </div>
</div>
<script>
const hostels=[
  {id:1,name:'Aryabhata Boys Hostel',type:'Boys Hostel',gender:'boys',total:120,occupied:98,available:22,rooms:[
    {type:'Single',beds:1,price:15000,icon:'ti-user'},
    {type:'Double Sharing',beds:2,price:10000,icon:'ti-users'},
    {type:'Triple Sharing',beds:3,price:8000,icon:'ti-users-group'},
  ]},
  {id:2,name:'Kalpana Girls Hostel',type:'Girls Hostel',gender:'girls',total:100,occupied:82,available:18,rooms:[
    {type:'Single AC',beds:1,price:18000,icon:'ti-user'},
    {type:'Double Sharing',beds:2,price:12000,icon:'ti-users'},
    {type:'Triple Sharing',beds:3,price:9000,icon:'ti-users-group'},
  ]},
  {id:3,name:'Vivekananda Boys Hostel',type:'Boys Hostel (Senior)',gender:'boys',total:80,occupied:72,available:8,rooms:[
    {type:'Single AC',beds:1,price:20000,icon:'ti-user'},
    {type:'Double Sharing AC',beds:2,price:14000,icon:'ti-users'},
  ]},
];
let selHostelId=null,selRoomType=null;

function renderHostels(){
  document.getElementById('hostelsGrid').innerHTML=hostels.map(h=>`
    <div class="hostel-card ${selHostelId===h.id?'selected':''}" onclick="selectHostel(${h.id})">
      <div class="hostel-banner ${h.gender}"><i class="ti ti-building-estate"></i></div>
      <div class="hostel-info">
        <div class="hostel-name">${h.name}</div>
        <div class="hostel-type">${h.type}</div>
        <div class="hostel-stats">
          <div class="hs-item"><div class="hs-val">${h.total}</div><div class="hs-label">Total Beds</div></div>
          <div class="hs-item"><div class="hs-val">${h.occupied}</div><div class="hs-label">Occupied</div></div>
          <div class="hs-item"><div class="hs-val" style="color:${h.available<10?'#dc2626':'var(--green)'}">${h.available}</div><div class="hs-label">Available</div></div>
        </div>
      </div>
    </div>`).join('');
}
function selectHostel(id){
  selHostelId=id;selRoomType=null;
  const h=hostels.find(x=>x.id===id);
  document.getElementById('selHostel').value=h.name;
  document.getElementById('selRoom').value='';
  document.getElementById('roomsSection').classList.add('show');
  document.getElementById('roomsGrid').innerHTML=h.rooms.map((r,i)=>`
    <div class="room-card ${selRoomType===i?'selected':''}" onclick="selectRoom(${i})">
      <div class="room-icon"><i class="${r.icon}"></i></div>
      <div class="room-type">${r.type}</div>
      <div class="room-beds">${r.beds} bed${r.beds>1?'s':''} per room</div>
      <div class="room-price">₹${r.price.toLocaleString('en-IN')} <span>/month</span></div>
    </div>`).join('');
  document.getElementById('formCard').classList.remove('show');
  renderHostels();
}
function selectRoom(idx){
  selRoomType=idx;
  const h=hostels.find(x=>x.id===selHostelId);
  document.getElementById('selRoom').value=h.rooms[idx].type+' – ₹'+h.rooms[idx].price.toLocaleString('en-IN')+'/month';
  document.getElementById('formCard').classList.add('show');
  // re-render rooms to show selected
  const rs=document.querySelectorAll('.room-card');
  rs.forEach((r,i)=>{r.classList.toggle('selected',i===idx);});
}
function submitApp(){
  if(!selHostelId||selRoomType===null)return alert('Please select hostel and room type');
  alert('✅ Hostel application submitted successfully! Admin will review and notify you.');
}
renderHostels();
</script>
<script src="sidebar.js"></script>
</body>
</html>
