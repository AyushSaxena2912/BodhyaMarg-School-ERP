<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>BodhyaMarg ERP – Payment Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green: #1a7a4a; --green-light: #e6f4ee; --green-dark: #145e38;
  --bg: #f4f6f8; --white: #ffffff; --border: #e2e6ea;
  --text: #1a1d23; --text-muted: #6b7280; --text-hint: #9ca3af;
  --radius: 8px; --radius-lg: 12px;
  --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
  --shadow-lg: 0 10px 25px rgba(26, 29, 35, 0.08);
  --blue: #3b82f6; --blue-light: #eff6ff;
}

body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; }

/* Sidebar overrides */
.sidebar a,.sidebar a:link,.sidebar a:visited,.sidebar a:hover,.sidebar a:active{text-decoration:none!important;color:inherit;}

/* Main Layout */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 10px 24px; background: var(--white); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.topbar-search { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 12px; width: 280px; }
.topbar-search i { font-size: 14px; color: var(--text-hint); }
.topbar-search input { border: none; background: transparent; font-size: 12.5px; font-family: inherit; outline: none; width: 100%; }
.topbar-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.icon-btn { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius); border: 1px solid var(--border); background: var(--white); cursor: pointer; color: var(--text-muted); }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--green); color: #fff; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; cursor: pointer; }

/* Content Area */
.content { flex: 1; overflow-y: auto; padding: 24px; display: flex; gap: 24px; }
.content::-webkit-scrollbar { width: 6px; }
.content::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

/* Settings Content */
.settings-content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.page-title h1 { font-size: 18px; font-weight: 700; color: var(--text); }
.page-title p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
.header-actions { display: flex; gap: 10px; }

/* Buttons */
.btn { padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; transition: all 0.15s; border: 1px solid transparent; font-family: inherit; }
.btn-primary { background: #4f46e5; color: var(--white); }
.btn-primary:hover { background: #4338ca; }
.btn-secondary { background: var(--white); color: var(--text); border-color: var(--border); }
.btn-secondary:hover { background: var(--bg); }
.btn-icon { padding: 8px; width: 34px; justify-content: center; }

/* Gateway Grid */
.gateway-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
.gateway-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.gc-header { display: flex; justify-content: space-between; align-items: center; }
.gc-logo { font-size: 20px; font-weight: 800; font-style: italic; letter-spacing: -0.5px; }
.gc-status-area { display: flex; align-items: center; gap: 10px; }

/* Status Labels */
.status-label { font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 4px; }
.status-label.connected { background: #ecfdf5; color: #10b981; }
.status-label.disconnected { background: var(--bg); color: var(--text-muted); }

/* Toggle Switch */
.toggle-switch { position: relative; display: inline-block; width: 36px; height: 20px; }
.toggle-switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .3s; border-radius: 20px; }
.slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
input:checked + .slider { background-color: #4f46e5; }
input:checked + .slider:before { transform: translateX(16px); }

/* Card Content */
.gc-desc { font-size: 13px; color: var(--text-muted); line-height: 1.5; flex: 1; }
.gc-action { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); }
.btn-connect { width: 100%; justify-content: center; background: var(--white); border: 1px solid var(--border); color: var(--text); padding: 8px; font-size: 13px; font-weight: 600; border-radius: var(--radius); cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
.btn-connect:hover { border-color: #4f46e5; color: #4f46e5; background: #eef2ff; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
.modal { background: var(--white); border-radius: var(--radius-lg); width: 100%; max-width: 500px; box-shadow: var(--shadow-lg); overflow: hidden; display: flex; flex-direction: column; }
.modal-header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.modal-title { font-size: 18px; font-weight: 700; color: #1e1e2d; }
.modal-close { background: #9ca3af; color: white; border: none; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; }
.modal-body { padding: 24px; display: flex; flex-direction: column; gap: 20px; }
.modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 12px; background: #f8fafc; }

/* Form Group */
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group label { font-size: 13px; font-weight: 600; color: #1e1e2d; }
.form-group input { padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; outline: none; transition: border-color 0.2s; }
.form-group input:focus { border-color: #4f46e5; }
.form-group input::placeholder { color: #9ca3af; }

</style>
<script src="permissions.js"></script>
<script>BodhyaAuth.guardPage(['admin', 'superadmin']);</script>
</head>
<body>

<div id="sidebar-container"></div>

<div class="main">
  <!-- Topbar Header -->
  <div class="topbar">
    <div class="topbar-search">
      <i class="ti ti-search"></i>
      <input type="text" placeholder="Search operations, features, settings…" />
    </div>
    <div class="topbar-right">
      <div class="icon-btn"><i class="ti ti-bell"></i></div>
      <div class="avatar">A</div>
    </div>
  </div>

  <div class="content">
    
    <!-- Main Settings Area -->
    <div class="settings-content" style="width: 100%;">
      
      <div class="page-header">
        <div class="page-title">
          <h1>Payment Gateways</h1>
          <p>Payments Settings Configuration</p>
        </div>
        <div class="header-actions">
          <button class="btn btn-secondary btn-icon"><i class="ti ti-mail"></i></button>
          <button class="btn btn-secondary">Cancel</button>
          <button class="btn btn-primary">Save</button>
        </div>
      </div>

      <div class="gateway-grid" id="gatewayGrid">
        <!-- Grid items generated by JS -->
      </div>

    </div>

  </div>
</div>

<!-- Integration Modal -->
<div class="modal-overlay" id="integrationModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalGatewayName">PayPal</div>
      <button class="modal-close" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" placeholder="Enter Email Address" id="gatewayEmail" />
      </div>
      <div class="form-group">
        <label>API Key</label>
        <input type="text" placeholder="Enter API Key" id="gatewayApiKey" />
      </div>
      <div class="form-group">
        <label>Secret Key</label>
        <input type="text" placeholder="Enter Secret Key" id="gatewaySecretKey" />
      </div>
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px;">
        <div>
          <div style="font-size: 14px; font-weight: 600; color: #1e1e2d; margin-bottom: 2px;">Status</div>
          <div style="font-size: 13px; color: var(--text-muted);">Change the Status by toggle</div>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="gatewayStatusToggle" checked>
          <span class="slider"></span>
        </label>
      </div>

    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" style="background: #e2e8f0; border: none; color: #475569;" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveIntegration()">Submit</button>
    </div>
  </div>
</div>

<script>
const gateways = [
  { id: 'razorpay', name: 'Razorpay', img: 'Razorpay.png', connected: true },
  { id: 'cashfree', name: 'Cashfree', img: 'Cashfree.png', connected: false },
  { id: 'paypal', name: 'PayPal', img: 'PayPal.png', connected: false },
  { id: 'stripe', name: 'Stripe', img: 'Stripe.png', connected: false }
];

function renderGrid() {
  const grid = document.getElementById('gatewayGrid');
  grid.innerHTML = '';
  
  gateways.forEach(gw => {
    const isConn = gw.connected;
    const height = gw.imgHeight || '28px';
    const logoHtml = gw.img 
      ? `<img src="${gw.img}" alt="${gw.name}" style="height: ${height}; object-fit: contain; margin-left: -4px;">`
      : `<div class="gc-logo" style="color: ${gw.color}; font-size: 22px;">${gw.name}</div>`;
      
    grid.innerHTML += `
      <div class="gateway-card" style="gap: 20px;">
        <div class="gc-header">
          ${logoHtml}
          <div class="gc-status-area">
            <label class="toggle-switch">
              <input type="checkbox" ${isConn ? 'checked' : ''} onchange="toggleStatus('${gw.id}', this.checked)">
              <span class="slider"></span>
            </label>
          </div>
        </div>
        <div class="gc-action" style="padding-top: 0; border-top: none; margin-top: 0;">
          <button class="btn-connect" onclick="openModal('${gw.id}')">
            <i class="ti ti-settings"></i> ${isConn ? 'View Integration' : 'Connect Now'}
          </button>
        </div>
      </div>
    `;
  });
}

function toggleStatus(id, checked) {
  const gw = gateways.find(g => g.id === id);
  if(gw) {
    gw.connected = checked;
    renderGrid();
  }
}

let activeGatewayId = null;

function openModal(id) {
  const gw = gateways.find(g => g.id === id);
  if(!gw) return;
  activeGatewayId = id;
  
  document.getElementById('modalGatewayName').innerText = gw.name;
  // Mock data population
  document.getElementById('gatewayEmail').value = gw.connected ? 'admin@school.com' : '';
  document.getElementById('gatewayApiKey').value = gw.connected ? 'pk_live_xxxxxxxxx' : '';
  document.getElementById('gatewaySecretKey').value = gw.connected ? 'sk_live_xxxxxxxxx' : '';
  document.getElementById('gatewayStatusToggle').checked = gw.connected;
  
  document.getElementById('integrationModal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('integrationModal').style.display = 'none';
  activeGatewayId = null;
}

function saveIntegration() {
  const isChecked = document.getElementById('gatewayStatusToggle').checked;
  const gw = gateways.find(g => g.id === activeGatewayId);
  if(gw) {
    gw.connected = isChecked;
    renderGrid();
  }
  closeModal();
}

document.addEventListener('DOMContentLoaded', () => {
  renderGrid();
});
</script>
<script src="sidebar.js"></script>
</body>
</html>
