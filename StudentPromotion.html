<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BodhyaMarg ERP – Student Promotion</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green: #1a7a4a; --green-light: #e6f4ee; --green-dark: #145e38;
  --bg: #f8fafc; --white: #ffffff; --border: #e2e8f0;
  --text: #1e293b; --text-muted: #64748b; --text-hint: #94a3b8;
  --radius: 8px; --radius-lg: 12px;
}
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; }

.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 10px 24px; background: var(--white); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.topbar-search { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 12px; width: 280px; }
.topbar-search i { font-size: 14px; color: var(--text-hint); }
.topbar-search input { border: none; background: transparent; font-size: 12.5px; font-family: inherit; outline: none; width: 100%; }
.topbar-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.icon-btn { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius); border: 1px solid var(--border); background: var(--white); cursor: pointer; color: var(--text-muted); }
.av { width: 34px; height: 34px; border-radius: 50%; background: var(--green); color: #fff; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; cursor: pointer; }

.content { flex: 1; overflow-y: auto; padding: 24px; }
.content::-webkit-scrollbar { width: 4px; }
.content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
.page-header h1 { font-size: 20px; font-weight: 600; }
.breadcrumb { font-size: 11.5px; color: var(--text-hint); margin-top: 3px; display: flex; align-items: center; gap: 4px; }
.bc-green { color: var(--green); font-weight: 500; }

.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--white); color: var(--text); transition: all 0.2s; white-space: nowrap; }
.btn:hover { background: var(--bg); }
.btn-primary { background: var(--green); color: #fff; border-color: var(--green); }
.btn-primary:hover { background: var(--green-dark); color: #fff; }
.btn-primary:disabled { background: var(--text-hint); border-color: var(--text-hint); cursor: not-allowed; }

/* Filter Controls */
.controls-card { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; background: var(--white); padding: 16px 20px; border-radius: var(--radius-lg); border: 1px solid var(--border); flex-wrap: wrap; gap: 16px; }
.controls-title { font-size: 16px; font-weight: 700; color: var(--text); margin-right: auto; }
.controls-filters { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.input-box { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); padding: 8px 12px; border-radius: var(--radius); font-size: 13px; color: var(--text-muted); background: var(--white); }
.input-box select, .input-box input { border: none; outline: none; background: transparent; font-family: inherit; font-size: 13px; color: var(--text); padding-right: 4px; cursor: pointer; -webkit-appearance: none; appearance: none; }
.input-box i { color: var(--text-hint); font-size: 16px; }
.input-box .ti-chevron-down { font-size: 14px; margin-left: -4px; pointer-events: none; }
.arrow-sep { color: var(--text-hint); font-size: 16px; display: flex; align-items: center; }

/* Table Wrapper */
.table-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 20px; }
.table-toolbar { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
.table-title { font-size: 15px; font-weight: 600; }
.table-actions { display: flex; align-items: center; gap: 12px; }
.table-search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); padding: 6px 12px; border-radius: var(--radius); }
.table-search input { border: none; outline: none; background: transparent; font-size: 13px; font-family: inherit; width: 200px; }

.table-responsive { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 900px; }
thead tr { background: #f8fafc; border-bottom: 1px solid var(--border); }
thead th { padding: 14px 20px; font-size: 12px; font-weight: 600; color: var(--text-muted); text-align: left; white-space: nowrap; }
tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: #f8fafc; }
tbody td { padding: 14px 20px; font-size: 13.5px; color: var(--text); vertical-align: middle; }

.checkbox-cell { width: 48px; }
.checkbox-custom { width: 18px; height: 18px; border: 1.5px solid var(--text-hint); border-radius: 4px; display: inline-block; cursor: pointer; position: relative; }
.checkbox-custom.checked { background: var(--green); border-color: var(--green); }
.checkbox-custom.checked::after { content: ''; position: absolute; left: 5px; top: 2px; width: 5px; height: 10px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.checkbox-custom.disabled { background: #f1f5f9; border-color: var(--border); cursor: not-allowed; }

.student-info { display: flex; align-items: center; gap: 12px; }
.student-av { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px; }
.student-name { font-weight: 600; color: var(--text); }
.student-roll { font-size: 11px; color: var(--text-hint); margin-top: 2px; }

/* Status Badges */
.status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
.status-badge.pass { background: #ecfdf5; color: #10b981; }
.status-badge.grace { background: #eff6ff; color: #3b82f6; }
.status-badge.supplementary { background: #fffbeb; color: #f59e0b; }
.status-badge.fail { background: #fef2f2; color: #ef4444; }
.status-badge::before { content:''; width:6px; height:6px; border-radius:50%; }
.status-badge.pass::before { background:#10b981; }
.status-badge.grace::before { background:#3b82f6; }
.status-badge.supplementary::before { background:#f59e0b; }
.status-badge.fail::before { background:#ef4444; }

.action-card { display: flex; align-items: center; justify-content: flex-end; padding: 16px 20px; background: #fafbfc; border-top: 1px solid var(--border); }

/* Modal Styles */
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.4); display: none; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(2px); }
.modal-overlay.active { display: flex; }
.modal { background: var(--white); width: 550px; max-width: 90%; border-radius: var(--radius-lg); box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; }
.modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #f8fafc; }
.modal-title { font-size: 16px; font-weight: 700; color: var(--text); }
.modal-close { cursor: pointer; color: var(--text-hint); transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 6px; }
.modal-close:hover { background: var(--border); color: var(--text); }
.modal-body { padding: 24px; text-align: center; }
.modal-icon { width: 56px; height: 56px; border-radius: 50%; background: var(--green-light); color: var(--green); display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 16px; }
.modal-body h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.modal-body p { font-size: 13.5px; color: var(--text-muted); line-height: 1.5; margin-bottom: 20px; }
.promoted-summary { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; text-align: left; max-height: 200px; overflow-y: auto; font-size: 13px; }
.promoted-summary-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); }
.promoted-summary-item:last-child { border-bottom: none; }
.modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 24px; border-top: 1px solid var(--border); }
</style>
<style>
.sidebar a,.sidebar a:link,.sidebar a:visited,.sidebar a:hover,.sidebar a:active{text-decoration:none!important;color:inherit;}
</style>
</head>
<body>
<div id="sidebar-container"></div>
<div class="main">
  <div class="topbar">
    <div class="topbar-search"><i class="ti ti-search"></i><input type="text" placeholder="Search..." /></div>
    <div class="topbar-right">
      <div class="icon-btn"><i class="ti ti-bell" style="font-size:16px;"></i></div>
      <div class="icon-btn"><i class="ti ti-settings" style="font-size:16px;"></i></div>
      <div class="av">AD</div>
    </div>
  </div>
  <div class="content">
    <div class="page-header">
      <div>
        <h1>Student Promotion</h1>
        <div class="breadcrumb">
          Dashboard <i class="ti ti-chevron-right" style="font-size:10px;"></i>
          Peoples <i class="ti ti-chevron-right" style="font-size:10px;"></i>
          <span class="bc-green">Student Promotion</span>
        </div>
      </div>
    </div>

    <!-- Filters Card -->
    <div class="controls-card">
      <div class="controls-title">Promotion Criteria</div>
      <div class="controls-filters">
        <div class="input-box"><i class="ti ti-school"></i>
          <select id="currentClass">
            <option value="Class I">Class I</option>
            <option value="Class II">Class II</option>
            <option value="Class III">Class III</option>
            <option value="Class IV">Class IV</option>
            <option value="Class V">Class V</option>
            <option value="Class VI">Class VI</option>
            <option value="Class VII">Class VII</option>
            <option value="Class VIII">Class VIII</option>
            <option value="Class IX">Class IX</option>
            <option value="Class X" selected>Class X</option>
          </select><i class="ti ti-chevron-down"></i>
        </div>
        <div class="input-box"><i class="ti ti-layout-distribute-vertical"></i>
          <select id="currentSection">
            <option selected>Section A</option>
            <option>Section B</option>
            <option>Section C</option>
            <option>Section D</option>
            <option>Section E</option>
          </select><i class="ti ti-chevron-down"></i>
        </div>
        <div class="arrow-sep"><i class="ti ti-arrow-narrow-right"></i></div>
        <div class="input-box" style="background:#f1f5f9;"><i class="ti ti-chevrons-up" style="color:var(--green);"></i>
          <select id="targetClass" style="font-weight:600;color:var(--green);">
            <option value="Class II">Class II</option>
            <option value="Class III">Class III</option>
            <option value="Class IV">Class IV</option>
            <option value="Class V">Class V</option>
            <option value="Class VI">Class VI</option>
            <option value="Class VII">Class VII</option>
            <option value="Class VIII">Class VIII</option>
            <option value="Class IX">Class IX</option>
            <option value="Class X">Class X</option>
            <option value="Class XI" selected>Class XI</option>
            <option value="Class XII">Class XII</option>
          </select><i class="ti ti-chevron-down"></i>
        </div>
        <div class="input-box"><i class="ti ti-layout-distribute-vertical"></i>
          <select id="targetSection">
            <option selected>Section A</option>
            <option>Section B</option>
            <option>Section C</option>
            <option>Section D</option>
            <option>Section E</option>
          </select><i class="ti ti-chevron-down"></i>
        </div>
      </div>
    </div>

    <!-- Table Card -->
    <div class="table-card">
      <div class="table-toolbar">
        <div class="table-title">Select Students to Promote</div>
        <div class="table-actions">
          <div class="table-search"><i class="ti ti-search" style="color:var(--text-hint);"></i><input type="text" id="searchStudentInput" placeholder="Search student name..." /></div>
        </div>
      </div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th class="checkbox-cell"><div class="checkbox-custom" id="selectAllCheckbox"></div></th>
              <th>Student Details</th>
              <th>Current Class & Section</th>
              <th>Exam Status</th>
              <th>Target Promotion Details</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="studentBody">
            <!-- Populated by JS -->
          </tbody>
        </table>
      </div>
      <div class="action-card">
        <button class="btn btn-primary" id="promoteBtn" onclick="promoteSelected()"><i class="ti ti-circle-arrow-up"></i> Promote Students</button>
      </div>
    </div>

  </div>
</div>

<!-- Promotion Success Modal -->
<div class="modal-overlay" id="successModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Promotion Execution</div>
      <div class="modal-close" onclick="closeModal()"><i class="ti ti-x" style="font-size:20px;"></i></div>
    </div>
    <div class="modal-body">
      <div class="modal-icon"><i class="ti ti-circle-check"></i></div>
      <h3>Promotion Completed Successfully!</h3>
      <p id="promotionCountText">Students have been promoted to their next classes.</p>
      <div class="promoted-summary" id="promotedSummaryList">
        <!-- Populated dynamically -->
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" onclick="closeModal()">Done</button>
    </div>
  </div>
</div>

<script>
// Class levels order to auto-increment target class selection
const classOrder = [
  'Class I', 'Class II', 'Class III', 'Class IV', 'Class V', 
  'Class VI', 'Class VII', 'Class VIII', 'Class IX', 'Class X', 'Class XI', 'Class XII'
];

// Initial mock database of students with exam status (Pass, Grace, Supplementary, Fail)
// This data will be saved & updated in localStorage so promotions are persistent
const defaultStudents = [
  // Class X - A
  { id: 'S101', name: 'Aarav Sharma', roll: 'X-A-01', classSec: 'Class X - A', status: 'pass', remarks: '' },
  { id: 'S102', name: 'Diya Patel', roll: 'X-A-02', classSec: 'Class X - A', status: 'pass', remarks: '' },
  { id: 'S103', name: 'Ishaan Verma', roll: 'X-A-03', classSec: 'Class X - A', status: 'grace', remarks: 'Maths Grace (+3)' },
  { id: 'S104', name: 'Kavya Singh', roll: 'X-A-04', classSec: 'Class X - A', status: 'supplementary', remarks: 'Failed in Science' },
  { id: 'S105', name: 'Rohan Gupta', roll: 'X-A-05', classSec: 'Class X - A', status: 'supplementary', remarks: 'Failed in Maths' },
  { id: 'S106', name: 'Ananya Desai', roll: 'X-A-06', classSec: 'Class X - A', status: 'fail', remarks: 'Failed in 3 subjects' },
  { id: 'S107', name: 'Vihaan Joshi', roll: 'X-A-07', classSec: 'Class X - A', status: 'supplementary', remarks: 'Failed in 2 subjects' },
  { id: 'S108', name: 'Myra Shah', roll: 'X-A-08', classSec: 'Class X - A', status: 'grace', remarks: 'Hindi Grace (+2)' },
  { id: 'S109', name: 'Arjun Reddy', roll: 'X-A-09', classSec: 'Class X - A', status: 'supplementary', remarks: 'Failed in Social Science' },
  { id: 'S110', name: 'Priya Kumari', roll: 'X-A-10', classSec: 'Class X - A', status: 'fail', remarks: 'Failed in 4 subjects' },
  { id: 'S111', name: 'Neha Tiwari', roll: 'X-A-11', classSec: 'Class X - A', status: 'supplementary', remarks: 'Failed in 2 subjects' },
  { id: 'S112', name: 'Rahul Yadav', roll: 'X-A-12', classSec: 'Class X - A', status: 'pass', remarks: '' },

  // Class IX - A
  { id: 'S201', name: 'Raj Malhotra', roll: 'IX-A-01', classSec: 'Class IX - A', status: 'pass', remarks: '' },
  { id: 'S202', name: 'Simran Kaur', roll: 'IX-A-02', classSec: 'Class IX - A', status: 'pass', remarks: '' },
  { id: 'S203', name: 'Vikram Sethi', roll: 'IX-A-03', classSec: 'Class IX - A', status: 'fail', remarks: 'Failed in 3 subjects' },
  { id: 'S204', name: 'Neha Sharma', roll: 'IX-A-04', classSec: 'Class IX - A', status: 'supplementary', remarks: 'Failed in Science' },

  // Class VIII - A
  { id: 'S301', name: 'Devendra Singh', roll: 'VIII-A-01', classSec: 'Class VIII - A', status: 'pass', remarks: '' },
  { id: 'S302', name: 'Geeta Rao', roll: 'VIII-A-02', classSec: 'Class VIII - A', status: 'pass', remarks: '' }
];

// Load from local storage or set default
if (!localStorage.getItem('bodhyamarg_promotion_students')) {
  localStorage.setItem('bodhyamarg_promotion_students', JSON.stringify(defaultStudents));
}

function getStudents() {
  return JSON.parse(localStorage.getItem('bodhyamarg_promotion_students'));
}

function saveStudents(data) {
  localStorage.setItem('bodhyamarg_promotion_students', JSON.stringify(data));
}

function getInitials(name) {
  return name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
}

function getStatusBadge(status) {
  if (status === 'pass') return `<span class="status-badge pass">Passed</span>`;
  if (status === 'grace') return `<span class="status-badge grace">Grace Pass</span>`;
  if (status === 'supplementary') return `<span class="status-badge supplementary">Supplementary</span>`;
  return `<span class="status-badge fail">Failed</span>`;
}

function getAvColor(status) {
  if (status === 'pass' || status === 'grace') return { bg: '#ecfdf5', text: '#10b981' };
  if (status === 'supplementary') return { bg: '#fffbeb', text: '#f59e0b' };
  return { bg: '#fef2f2', text: '#ef4444' };
}

// Automatically increment Target Class select based on Current Class select
function updateTargetClass() {
  const currentClassVal = document.getElementById('currentClass').value;
  const idx = classOrder.indexOf(currentClassVal);
  if (idx !== -1 && idx < classOrder.length - 1) {
    document.getElementById('targetClass').value = classOrder[idx + 1];
  } else {
    // If XII is selected, target class remains XII (or select default XII)
    document.getElementById('targetClass').value = 'Class XII';
  }
}

function render() {
  const tbody = document.getElementById('studentBody');
  const currentClassVal = document.getElementById('currentClass').value;
  const currentSecVal = document.getElementById('currentSection').value;
  const targetClassVal = document.getElementById('targetClass').value;
  const targetSecVal = document.getElementById('targetSection').value;
  const searchQuery = document.getElementById('searchStudentInput').value.toLowerCase().trim();

  const students = getStudents();
  const filterClassSec = `${currentClassVal} - ${currentSecVal}`;

  // Filter students by class & section
  let filtered = students.filter(s => s.classSec === filterClassSec);

  // Filter by search query
  if (searchQuery) {
    filtered = filtered.filter(s => 
      s.name.toLowerCase().includes(searchQuery) ||
      s.roll.toLowerCase().includes(searchQuery) ||
      s.id.toLowerCase().includes(searchQuery)
    );
  }

  let html = '';
  if (filtered.length === 0) {
    html = `<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--text-muted);"><i class="ti ti-users-minus" style="font-size:24px;display:block;margin-bottom:8px;"></i>No students found in ${filterClassSec}.</td></tr>`;
    tbody.innerHTML = html;
    document.getElementById('selectAllCheckbox').classList.remove('checked');
    document.getElementById('selectAllCheckbox').classList.add('disabled');
    return;
  }

  document.getElementById('selectAllCheckbox').classList.remove('disabled');

  filtered.forEach(s => {
    const isEligible = s.status === 'pass' || s.status === 'grace';
    const av = getAvColor(s.status);
    const cbClass = isEligible ? 'checkbox-custom student-cb' : 'checkbox-custom disabled';
    const cbAttr = isEligible ? `data-id="${s.id}"` : 'data-disabled="true"';
    
    let targetDetail = '';
    let actionCell = '';
    if (isEligible) {
      targetDetail = `<div style="font-weight:600;color:var(--green);"><i class="ti ti-chevrons-up"></i> ${targetClassVal} - ${targetSecVal}</div>`;
      actionCell = `<span style="color:#10b981;font-weight:600;"><i class="ti ti-circle-check"></i> Eligible for Promotion</span>`;
    } else {
      const reason = s.status === 'fail' ? 'Failed' : 'Supplementary Exam Required';
      targetDetail = `<div style="color:var(--text-hint);text-decoration:line-through;">${targetClassVal} - ${targetSecVal}</div>`;
      actionCell = `<span style="color:#ef4444;font-weight:500;"><i class="ti ti-circle-x"></i> Not Eligible (${reason})</span>`;
    }

    html += `
      <tr style="${!isEligible ? 'background:#fafafa; opacity:0.85;' : ''}">
        <td class="checkbox-cell">
          <div class="${cbClass} ${isEligible ? 'checked' : ''}" ${cbAttr}></div>
        </td>
        <td>
          <div class="student-info">
            <div class="student-av" style="background:${av.bg};color:${av.text};">${getInitials(s.name)}</div>
            <div>
              <div class="student-name">${s.name}</div>
              <div class="student-roll">Roll: ${s.roll} &nbsp;|&nbsp; ID: ${s.id}</div>
            </div>
          </div>
        </td>
        <td style="color:var(--text-muted);font-weight:500;">${s.classSec}</td>
        <td>${getStatusBadge(s.status)}</td>
        <td>${targetDetail}</td>
        <td>${actionCell}</td>
      </tr>
    `;
  });

  tbody.innerHTML = html;

  // Setup checkboxes listeners
  const selectAllCb = document.getElementById('selectAllCheckbox');
  const bodyCbs = tbody.querySelectorAll('.checkbox-custom.student-cb');

  bodyCbs.forEach(cb => {
    cb.addEventListener('click', function() {
      this.classList.toggle('checked');
      const allChecked = Array.from(bodyCbs).every(c => c.classList.contains('checked'));
      if (allChecked) selectAllCb.classList.add('checked');
      else selectAllCb.classList.remove('checked');
    });
  });

  // Re-attach select all event listener
  const newSelectAll = selectAllCb.cloneNode(true);
  selectAllCb.parentNode.replaceChild(newSelectAll, selectAllCb);
  
  // Set initial selectAll checkbox status
  if (bodyCbs.length > 0 && Array.from(bodyCbs).every(c => c.classList.contains('checked'))) {
    newSelectAll.classList.add('checked');
  } else {
    newSelectAll.classList.remove('checked');
  }

  newSelectAll.addEventListener('click', function () {
    if (this.classList.contains('disabled')) return;
    this.classList.toggle('checked');
    const isChecked = this.classList.contains('checked');
    bodyCbs.forEach(cb => {
      if (isChecked) cb.classList.add('checked');
      else cb.classList.remove('checked');
    });
  });
}

function promoteSelected() {
  const selectedCbs = document.querySelectorAll('.checkbox-custom.student-cb.checked');
  if (selectedCbs.length === 0) {
    alert('Please select at least one eligible student to promote!');
    return;
  }

  const promotedIds = Array.from(selectedCbs).map(cb => cb.getAttribute('data-id'));
  const targetClassVal = document.getElementById('targetClass').value;
  const targetSecVal = document.getElementById('targetSection').value;
  const newClassSec = `${targetClassVal} - ${targetSecVal}`;

  let students = getStudents();
  let promotedList = [];

  students = students.map(s => {
    if (promotedIds.includes(s.id)) {
      promotedList.push(s);
      // Increment roll number prefix (e.g. X-A-01 to XI-A-01)
      const rollNum = s.roll.split('-').pop(); // gets "01"
      const targetPrefix = targetClassVal.replace('Class ', ''); // gets "XI"
      const targetSecLetter = targetSecVal.replace('Section ', ''); // gets "A"
      const newRoll = `${targetPrefix}-${targetSecLetter}-${rollNum}`;

      return {
        ...s,
        classSec: newClassSec,
        roll: newRoll
      };
    }
    return s;
  });

  saveStudents(students);

  // Show summary modal
  document.getElementById('promotionCountText').textContent = `${promotedList.length} student(s) promoted successfully to ${newClassSec}!`;
  let summaryHtml = '';
  promotedList.forEach(s => {
    summaryHtml += `
      <div class="promoted-summary-item">
        <span style="font-weight:600;">${s.name} (Roll: ${s.roll})</span>
        <span style="color:var(--green);font-weight:500;">Promoted $\\to$ ${targetClassVal} - ${targetSecVal}</span>
      </div>
    `;
  });
  document.getElementById('promotedSummaryList').innerHTML = summaryHtml;
  document.getElementById('successModal').classList.add('active');

  // Refresh Table
  render();
}

function closeModal() {
  document.getElementById('successModal').classList.remove('active');
}

// Setup Event Listeners
document.addEventListener('DOMContentLoaded', () => {
  updateTargetClass();
  render();

  document.getElementById('currentClass').addEventListener('change', () => {
    updateTargetClass();
    render();
  });
  document.getElementById('currentSection').addEventListener('change', render);
  document.getElementById('targetClass').addEventListener('change', render);
  document.getElementById('targetSection').addEventListener('change', render);
  document.getElementById('searchStudentInput').addEventListener('input', render);
});
</script>
