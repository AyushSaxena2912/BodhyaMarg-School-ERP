<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BodhyaMarg ERP – Exam Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green: #1a7a4a; --green-light: #e6f4ee; --green-dark: #145e38;
  --bg: #f8fafc; --white: #ffffff; --border: #e2e8f0;
  --text: #1e293b; --text-muted: #64748b; --text-hint: #94a3b8;
  --radius: 8px; --radius-lg: 12px;
}
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; }
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 10px 24px; background: var(--white); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.topbar-search { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 12px; width: 280px; }
.topbar-search i { font-size: 14px; color: var(--text-hint); }
.topbar-search input { border: none; background: transparent; font-size: 12.5px; font-family: inherit; outline: none; width: 100%; }
.topbar-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.icon-btn { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius); border: 1px solid var(--border); background: var(--white); cursor: pointer; color: var(--text-muted); }
.av { width: 34px; height: 34px; border-radius: 50%; background: var(--green); color: #fff; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.content { flex: 1; overflow-y: auto; padding: 24px; }
.content::-webkit-scrollbar { width: 4px; }
.content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
.page-header h1 { font-size: 20px; font-weight: 600; }
.breadcrumb { font-size: 11.5px; color: var(--text-hint); margin-top: 3px; display: flex; align-items: center; gap: 4px; }
.bc-green { color: var(--green); font-weight: 500; }
.page-actions { display: flex; gap: 10px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--white); color: var(--text); transition: all 0.2s; white-space: nowrap; }
.btn:hover { background: var(--bg); }
.btn-primary { background: var(--green); color: #fff; border-color: var(--green); }
.btn-primary:hover { background: var(--green-dark); color: #fff; }

.controls-card { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; background: var(--white); padding: 16px 20px; border-radius: var(--radius-lg); border: 1px solid var(--border); flex-wrap: wrap; gap: 16px; }
.controls-title { font-size: 16px; font-weight: 700; color: var(--text); margin-right: auto; }
.controls-filters { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.input-box { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); padding: 8px 12px; border-radius: var(--radius); font-size: 13px; color: var(--text-muted); background: var(--white); }
.input-box select { border: none; outline: none; background: transparent; font-family: inherit; font-size: 13px; color: var(--text); padding-right: 4px; cursor: pointer; -webkit-appearance: none; appearance: none; }
.input-box i { color: var(--text-hint); font-size: 16px; }
.input-box .ti-chevron-down { font-size: 14px; margin-left: -4px; pointer-events: none; }



.table-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.table-toolbar { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
.table-entries { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); }
.table-entries select { padding: 6px 28px 6px 10px; border-radius: var(--radius); border: 1px solid var(--border); outline: none; font-family: inherit; font-size: 13px; }
.table-search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); padding: 6px 12px; border-radius: var(--radius); }
.table-search input { border: none; outline: none; background: transparent; font-size: 13px; font-family: inherit; width: 200px; }

.table-responsive { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 900px; }
thead tr { background: #f8fafc; border-bottom: 1px solid var(--border); }
thead th { padding: 14px 20px; font-size: 12px; font-weight: 600; color: var(--text-muted); text-align: left; white-space: nowrap; }
tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: #f8fafc; }
tbody td { padding: 14px 20px; font-size: 13.5px; color: var(--text); vertical-align: middle; }

.checkbox-cell { width: 48px; }
.checkbox-custom { width: 18px; height: 18px; border: 1.5px solid var(--text-hint); border-radius: 4px; display: inline-block; cursor: pointer; position: relative; }
.checkbox-custom.checked { background: var(--green); border-color: var(--green); }
.checkbox-custom.checked::after { content: ''; position: absolute; left: 5px; top: 2px; width: 5px; height: 10px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }

.student-info { display: flex; align-items: center; gap: 12px; }
.student-av { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px; }
.student-name { font-weight: 600; }
.student-roll { font-size: 11px; color: var(--text-hint); margin-top: 2px; }

.status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
.status-badge.present { background: #ecfdf5; color: #10b981; }
.status-badge.absent { background: #fef2f2; color: #ef4444; }
.status-badge.late { background: #fffbeb; color: #f59e0b; }
.status-badge::before { content:''; width:6px; height:6px; border-radius:50%; }
.status-badge.present::before { background:#10b981; }
.status-badge.absent::before { background:#ef4444; }
.status-badge.late::before { background:#f59e0b; }

.remarks-text { font-size: 12px; color: var(--text-muted); max-width: 180px; }
</style>
<style>
.sidebar a,.sidebar a:link,.sidebar a:visited,.sidebar a:hover,.sidebar a:active{text-decoration:none!important;color:inherit;}
</style>
</head>
<body>
<div id="sidebar-container"></div>
<div class="main">
  <div class="topbar">
    <div class="topbar-search"><i class="ti ti-search"></i><input type="text" placeholder="Search..." /></div>
    <div class="topbar-right">
      <div class="icon-btn"><i class="ti ti-bell" style="font-size:16px;"></i></div>
      <div class="icon-btn"><i class="ti ti-settings" style="font-size:16px;"></i></div>
      <div class="av">AD</div>
    </div>
  </div>
  <div class="content">
    <div class="page-header">
      <div>
        <h1>Exam Attendance</h1>
        <div class="breadcrumb">
          Dashboard <i class="ti ti-chevron-right" style="font-size:10px;"></i>
          Academic <i class="ti ti-chevron-right" style="font-size:10px;"></i>
          <span class="bc-green">Exam Attendance</span>
        </div>
      </div>
      <div class="page-actions">
        <button class="btn" title="Print"><i class="ti ti-printer"></i></button>
        <button class="btn"><i class="ti ti-file-export"></i> Export <i class="ti ti-chevron-down" style="font-size:14px;color:var(--text-hint);"></i></button>
      </div>
    </div>

    <!-- Filters -->
    <div class="controls-card">
      <div class="controls-title">Attendance Records</div>
      <div class="controls-filters">
        <div class="input-box"><i class="ti ti-books"></i>
          <select id="filterClass">
            <option>Class I</option><option>Class II</option><option>Class III</option><option>Class IV</option><option>Class V</option>
            <option>Class VI</option><option>Class VII</option><option>Class VIII</option><option>Class IX</option><option selected>Class X</option>
          </select><i class="ti ti-chevron-down"></i>
        </div>
        <div class="input-box"><i class="ti ti-layout-distribute-vertical"></i>
          <select id="filterSection">
            <option selected>Section A</option><option>Section B</option><option>Section C</option><option>Section D</option><option>Section E</option>
          </select><i class="ti ti-chevron-down"></i>
        </div>
        <div class="input-box"><i class="ti ti-test-pipe"></i>
          <select id="filterExam">
            <option selected>Formative Assessment - 1</option><option>Formative Assessment - 2</option><option>Formative Assessment - 3</option>
            <option>Formative Assessment - 4</option><option>Summative Assessment - 1</option><option>Summative Assessment - 2</option>
          </select><i class="ti ti-chevron-down"></i>
        </div>
        <div class="input-box"><i class="ti ti-book-2"></i>
          <select id="filterSubject">
            <option selected>Mathematics</option><option>Science</option><option>English</option><option>Hindi</option><option>Social Science</option>
          </select><i class="ti ti-chevron-down"></i>
        </div>
        <button class="btn btn-primary" style="padding:8px 12px;"><i class="ti ti-search"></i></button>
      </div>
    </div>

    <!-- Summary Cards -->


    <!-- Table -->
    <div class="table-card">
      <div class="table-toolbar">
        <div class="table-entries">Row Per Page <select><option>10</option><option>25</option><option>50</option></select> Entries</div>
        <div class="table-search"><input type="text" placeholder="Search Student..." /></div>
      </div>
      <div class="table-responsive">
        <table>
          <thead><tr>
            <th class="checkbox-cell"><div class="checkbox-custom" id="selectAllCheckbox"></div></th>
            <th>Student Name</th>
            <th>Class & Section</th>
            <th>Exam Date</th>
            <th>Subject</th>
            <th>Status</th>
          </tr></thead>
          <tbody id="attendanceBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
/*
 * ===== EXAM ATTENDANCE LOGIC =====
 * Statuses:
 *  - PRESENT: Student arrived on time (before or at exam start)
 *  - LATE: Student arrived after exam started but within allowed window (≤30 min late)
 *           → still allowed to sit for exam, but marked late
 *  - ABSENT: Student did not appear at all, or arrived >30 min late (not allowed entry)
 *
 * Edge cases covered:
 *  1. Present on time → status "Present", arrival = exam start time
 *  2. Late by few minutes (5-15 min) → "Late", shows how many minutes late
 *  3. Late by significant time (20-30 min) → "Late", shows minutes, remark: "Final warning"
 *  4. Late by >30 min → converted to "Absent" (not allowed to sit), remark: "Denied entry – too late"
 *  5. Absent with medical certificate → "Absent", remark: "Medical leave (certificate submitted)"
 *  6. Absent without reason → "Absent", remark: "No reason provided"
 *  7. Absent due to family emergency → "Absent", remark: "Family emergency"
 *  8. Present but arrived exactly at start → "Present", remark: "On time"
 *  9. Present, arrived early → "Present", remark: "Arrived early"
 * 10. Absent – wrong exam center → edge case, remark: "Reported to wrong center"
 */

const EXAM_START = '09:30 AM';
const EXAM_DATE = '24 May 2026';
const LATE_THRESHOLD_MIN = 30; // Beyond 30 min late = absent

const attendanceData = [
  // 1. Present – arrived early
  { name: 'Aarav Sharma',  roll: 'X-A-01', classSec: 'Class X - A', status: 'present',
    arrival: '09:15 AM', remarks: 'Arrived early' },

  // 2. Present – on time
  { name: 'Diya Patel',    roll: 'X-A-02', classSec: 'Class X - A', status: 'present',
    arrival: '09:30 AM', remarks: 'On time' },

  // 3. Late – 10 minutes late (allowed, but marked late)
  { name: 'Ishaan Verma',  roll: 'X-A-03', classSec: 'Class X - A', status: 'late',
    arrival: '09:40 AM', lateBy: 10, remarks: 'Arrived 10 min late' },

  // 4. Absent – medical leave with certificate
  { name: 'Kavya Singh',   roll: 'X-A-04', classSec: 'Class X - A', status: 'absent',
    arrival: '—', remarks: 'Medical leave (certificate submitted)' },

  // 5. Present – on time
  { name: 'Rohan Gupta',   roll: 'X-A-05', classSec: 'Class X - A', status: 'present',
    arrival: '09:28 AM', remarks: 'On time' },

  // 6. Absent – no reason given
  { name: 'Ananya Desai',  roll: 'X-A-06', classSec: 'Class X - A', status: 'absent',
    arrival: '—', remarks: 'No reason provided' },

  // 7. Late – 25 min late (still within 30 min window, but final warning)
  { name: 'Vihaan Joshi',  roll: 'X-A-07', classSec: 'Class X - A', status: 'late',
    arrival: '09:55 AM', lateBy: 25, remarks: 'Arrived 25 min late – Final warning' },

  // 8. Present – on time
  { name: 'Myra Shah',     roll: 'X-A-08', classSec: 'Class X - A', status: 'present',
    arrival: '09:25 AM', remarks: 'On time' },

  // 9. Absent – family emergency
  { name: 'Arjun Reddy',   roll: 'X-A-09', classSec: 'Class X - A', status: 'absent',
    arrival: '—', remarks: 'Family emergency' },

  // 10. Present – on time
  { name: 'Priya Kumari',  roll: 'X-A-10', classSec: 'Class X - A', status: 'present',
    arrival: '09:30 AM', remarks: 'On time' },

  // 11. EDGE CASE: Arrived 35 min late → denied entry → marked Absent
  { name: 'Neha Tiwari',   roll: 'X-A-11', classSec: 'Class X - A', status: 'absent',
    arrival: '10:05 AM', remarks: 'Denied entry – arrived 35 min late' },

  // 12. Late – 5 min late (minor)
  { name: 'Rahul Yadav',   roll: 'X-A-12', classSec: 'Class X - A', status: 'late',
    arrival: '09:35 AM', lateBy: 5, remarks: 'Arrived 5 min late' },

  // 13. EDGE CASE: Absent – went to wrong exam center
  { name: 'Sneha Mishra',  roll: 'X-A-13', classSec: 'Class X - A', status: 'absent',
    arrival: '—', remarks: 'Reported to wrong exam center' },

  // 14. Present – arrived just in time
  { name: 'Aditya Kumar',  roll: 'X-A-14', classSec: 'Class X - A', status: 'present',
    arrival: '09:29 AM', remarks: 'On time' },

  // 15. Late – 15 min late
  { name: 'Riya Chopra',   roll: 'X-A-15', classSec: 'Class X - A', status: 'late',
    arrival: '09:45 AM', lateBy: 15, remarks: 'Arrived 15 min late – Bus delay' }
];

function getInitials(name) {
  return name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
}

function getAvColor(status) {
  if (status === 'present') return { bg: '#ecfdf5', text: '#10b981' };
  if (status === 'absent')  return { bg: '#fef2f2', text: '#ef4444' };
  return { bg: '#fffbeb', text: '#f59e0b' };
}



function render() {
  const tbody = document.getElementById('attendanceBody');
  let html = '';

  attendanceData.forEach(item => {
    let av = getAvColor(item.status);
    let statusLabel = item.status.charAt(0).toUpperCase() + item.status.slice(1);
    let lateInfo = item.lateBy ? `+${item.lateBy} min` : item.arrival;

    html += `
      <tr>
        <td class="checkbox-cell"><div class="checkbox-custom"></div></td>
        <td>
          <div class="student-info">
            <div class="student-av" style="background:${av.bg};color:${av.text};">${getInitials(item.name)}</div>
            <div><div class="student-name">${item.name}</div><div class="student-roll">Roll: ${item.roll}</div></div>
          </div>
        </td>
        <td style="color:var(--text-muted);font-weight:500;">${item.classSec}</td>
        <td>${EXAM_DATE}</td>
        <td style="font-weight:500;">Mathematics</td>
        <td><span class="status-badge ${item.status}">${statusLabel}</span></td>
      </tr>
    `;
  });

  tbody.innerHTML = html;

  const selectAllCb = document.getElementById('selectAllCheckbox');
  const bodyCbs = tbody.querySelectorAll('.checkbox-custom');

  bodyCbs.forEach(cb => {
    cb.addEventListener('click', function () { 
      this.classList.toggle('checked'); 
      const allChecked = Array.from(bodyCbs).every(c => c.classList.contains('checked'));
      if (allChecked) selectAllCb.classList.add('checked');
      else selectAllCb.classList.remove('checked');
    });
  });

  if (selectAllCb) {
    const newSelectAll = selectAllCb.cloneNode(true);
    selectAllCb.parentNode.replaceChild(newSelectAll, selectAllCb);
    
    newSelectAll.addEventListener('click', function () {
      this.classList.toggle('checked');
      const isChecked = this.classList.contains('checked');
      bodyCbs.forEach(cb => {
        if (isChecked) cb.classList.add('checked');
        else cb.classList.remove('checked');
      });
    });
  }
}

document.addEventListener('DOMContentLoaded', render);
</script>
<script src="sidebar.js"></script>
</body>
</html>
