<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BodhyaMarg ERP – Expense Category</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --green: #1a7a4a; --green-light: #e6f4ee; --green-dark: #145e38; --bg: #f4f6f8; --white: #ffffff; --border: #e2e6ea; --text: #1a1d23; --text-muted: #6b7280; --text-hint: #9ca3af; --radius: 8px; --radius-lg: 12px; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; }
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 10px 24px; background: var(--white); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.topbar-search { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 12px; width: 280px; }
.topbar-search i { font-size: 14px; color: var(--text-hint); } .topbar-search input { border: none; background: transparent; font-size: 12.5px; font-family: inherit; outline: none; width: 100%; }
.topbar-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.icon-btn { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius); border: 1px solid var(--border); background: var(--white); cursor: pointer; color: var(--text-muted); }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--green); color: #fff; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.content { flex: 1; overflow-y: auto; padding: 24px; }
.content::-webkit-scrollbar { width: 4px; } .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
.page-header h1 { font-size: 20px; font-weight: 600; }
.breadcrumb { font-size: 11.5px; color: var(--text-hint); margin-top: 3px; display: flex; align-items: center; gap: 4px; } .breadcrumb span { color: var(--green); }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius); font-size: 12.5px; font-weight: 500; font-family: inherit; cursor: pointer; border: 1px solid var(--border); background: var(--white); color: var(--text); white-space: nowrap; }
.btn:hover { background: var(--bg); } .btn-primary { background: var(--green); color: #fff; border-color: var(--green); } .btn-primary:hover { background: var(--green-dark); }
.table-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.table-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 12px; }
.toolbar-left { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-muted); }
.toolbar-right { display: flex; align-items: center; gap: 10px; }
.table-search { display: flex; align-items: center; gap: 7px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 12px; }
.table-search i { font-size: 13px; color: var(--text-hint); } .table-search input { border: none; background: transparent; font-size: 12px; font-family: inherit; outline: none; width: 180px; }
table { width: 100%; border-collapse: collapse; }
thead tr { background: var(--bg); border-bottom: 1px solid var(--border); }
thead th { padding: 11px 18px; font-size: 12px; font-weight: 600; color: var(--text-muted); text-align: left; }
tbody tr { border-bottom: 1px solid var(--border); } tbody tr:last-child { border-bottom: none; } tbody tr:hover { background: #fafbfc; }
tbody td { padding: 13px 18px; font-size: 12.5px; vertical-align: middle; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 500; }
.badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; }
.badge-active { background: var(--green-light); color: var(--green); } .badge-active::before { background: var(--green); }
.badge-inactive { background: #fef2f2; color: #dc2626; } .badge-inactive::before { background: #dc2626; }
.action-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: none; background: transparent; cursor: pointer; color: var(--text-muted); font-size: 18px; position: relative; } .action-btn:hover { background: var(--bg); }
.dropdown { position: absolute; right: 0; top: 32px; background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 4px 16px rgba(0,0,0,.08); min-width: 130px; z-index: 100; display: none; } .dropdown.open { display: block; }
.dropdown-item { display: flex; align-items: center; gap: 8px; padding: 8px 14px; font-size: 12.5px; color: var(--text-muted); cursor: pointer; } .dropdown-item:hover { background: var(--bg); }
.dropdown-item.danger { color: #dc2626; } .dropdown-item.danger:hover { background: #fef2f2; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity .15s; } .modal-overlay.open { opacity: 1; pointer-events: all; }
.modal { background: var(--white); border-radius: var(--radius-lg); width: 420px; padding: 28px; box-shadow: 0 8px 32px rgba(0,0,0,.14); }
.modal-title { font-size: 15px; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; } .modal-title i { color: var(--green); }
.modal-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 16px; }
.modal-field label { font-size: 11.5px; font-weight: 500; color: var(--text-muted); }
.modal-field input, .modal-field select { font-family: inherit; font-size: 12.5px; border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 10px; outline: none; }
.modal-field input:focus, .modal-field select:focus { border-color: var(--green); }
.modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
</style>
</head>
<body>
<div id="sidebar-container"></div>
<div class="main">
  <div class="topbar"><div class="topbar-search"><i class="ti ti-search"></i><input placeholder="Search anything…" /></div><div class="topbar-right"><div class="icon-btn"><i class="ti ti-bell"></i></div><div class="avatar">A</div></div></div>
  <div class="content">
    <div class="page-header">
      <div><h1>Expense Category</h1><div class="breadcrumb">Dashboard <i class="ti ti-chevron-right"></i> Finance <i class="ti ti-chevron-right"></i> <span>Expense Category</span></div></div>
      <button class="btn btn-primary" onclick="openModal()"><i class="ti ti-circle-plus"></i> Add Category</button>
    </div>
    <div class="table-card">
      <div class="table-toolbar"><div class="toolbar-left"><span>Expense Categories</span></div><div class="toolbar-right"><div class="table-search"><i class="ti ti-search"></i><input placeholder="Search" oninput="ft=this.value;render()" /></div></div></div>
      <table><thead><tr><th style="width:40px"><input type="checkbox" onchange="document.querySelectorAll('#tb input[type=checkbox]').forEach(c=>c.checked=this.checked)"/></th><th>Category Name</th><th>Description</th><th>Status</th><th>Action</th></tr></thead><tbody id="tb"></tbody></table>
    </div>
  </div>
</div>
<div class="modal-overlay" id="mo" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title"><i class="ti ti-category"></i> <span id="mh">Add Expense Category</span></div>
    <div class="modal-field"><label>Category Name *</label><input id="f1" placeholder="e.g. Utilities" /></div>
    <div class="modal-field"><label>Description</label><input id="f2" placeholder="Brief description" /></div>
    <div class="modal-field"><label>Status</label><select id="f3"><option value="Active">Active</option><option value="Inactive">Inactive</option></select></div>
    <div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="save()"><i class="ti ti-check"></i> Save</button></div>
  </div>
</div>
<script>
let data=[
  {id:1,name:'Salary & Wages',desc:'Staff and teacher salaries',status:'Active'},
  {id:2,name:'Utilities',desc:'Electricity, water, internet bills',status:'Active'},
  {id:3,name:'Maintenance',desc:'Building & equipment maintenance',status:'Active'},
  {id:4,name:'Stationery & Supplies',desc:'Office and classroom supplies',status:'Active'},
  {id:5,name:'Transport',desc:'Vehicle fuel, maintenance, driver salaries',status:'Active'},
  {id:6,name:'Events & Activities',desc:'Sports day, annual day, excursions',status:'Active'},
  {id:7,name:'IT & Software',desc:'Software licenses, hardware purchases',status:'Active'},
  {id:8,name:'Marketing',desc:'Advertisements, brochures, website',status:'Inactive'},
],nid=9,eid=null,ft='';
function render(){
  const f=data.filter(d=>d.name.toLowerCase().includes(ft.toLowerCase()));
  document.getElementById('tb').innerHTML=f.map(d=>`<tr><td><input type="checkbox"/></td><td style="font-weight:500">${d.name}</td><td style="color:var(--text-muted);font-size:12px">${d.desc}</td><td><span class="badge badge-${d.status.toLowerCase()}">${d.status}</span></td><td style="position:relative"><button class="action-btn" onclick="event.stopPropagation();document.querySelectorAll('.dropdown').forEach(x=>{if(x.id!=='m${d.id}')x.classList.remove('open')});document.getElementById('m${d.id}').classList.toggle('open')"><i class="ti ti-dots-vertical"></i></button><div class="dropdown" id="m${d.id}"><div class="dropdown-item" onclick="edit(${d.id})"><i class="ti ti-edit"></i> Edit</div><div class="dropdown-item danger" onclick="del(${d.id})"><i class="ti ti-trash"></i> Delete</div></div></td></tr>`).join('');
}
document.addEventListener('click',()=>document.querySelectorAll('.dropdown').forEach(d=>d.classList.remove('open')));
function openModal(){eid=null;document.getElementById('mh').textContent='Add Expense Category';['f1','f2'].forEach(i=>document.getElementById(i).value='');document.getElementById('f3').value='Active';document.getElementById('mo').classList.add('open');}
function edit(id){const d=data.find(x=>x.id===id);if(!d)return;eid=id;document.getElementById('mh').textContent='Edit Category';document.getElementById('f1').value=d.name;document.getElementById('f2').value=d.desc;document.getElementById('f3').value=d.status;document.getElementById('mo').classList.add('open');}
function closeModal(){document.getElementById('mo').classList.remove('open');}
function save(){const n=document.getElementById('f1').value.trim();if(!n)return alert('Name required');const obj={name:n,desc:document.getElementById('f2').value.trim(),status:document.getElementById('f3').value};if(eid){Object.assign(data.find(x=>x.id===eid),obj);}else{data.push({id:nid++,...obj});}closeModal();render();}
function del(id){if(confirm('Delete?')){data=data.filter(d=>d.id!==id);render();}}
render();
</script>
<script src="sidebar.js"></script>
</body>
</html>
