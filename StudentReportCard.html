<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #1a7a4a; --primary-light: #e6f4ee; --primary-dark: #145e38;
  --bg: #f1f5f9; --surface: #ffffff; --border: #e2e8f0;
  --text: #1e293b; --text-muted: #64748b; --text-hint: #94a3b8;
  --radius: 8px; --radius-lg: 14px;
  --danger: #ef4444; --danger-light: #fee2e2;
  --warning: #f59e0b; --warning-light: #fef3c7;
  --info: #3b82f6; --info-light: #dbeafe;
  --shadow: 0 4px 20px rgba(0,0,0,0.06);
}
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; }

.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* Topbar */
.topbar { display: flex; align-items: center; gap: 12px; padding: 10px 24px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.topbar-brand { font-weight: 700; font-size: 15px; color: var(--primary); }
.topbar-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.icon-btn { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); cursor: pointer; color: var(--text-muted); }
.av-circle { width: 34px; height: 34px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; }

/* Content Area */
.content { flex: 1; overflow-y: auto; padding: 24px; }
.content::-webkit-scrollbar { width: 4px; }
.content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* Page Header */
.page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
.page-header h1 { font-size: 20px; font-weight: 700; }
.breadcrumb { font-size: 11.5px; color: var(--text-hint); margin-top: 3px; display: flex; align-items: center; gap: 4px; }
.page-actions { display: flex; gap: 10px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text); transition: all 0.2s; white-space: nowrap; }
.btn:hover { background: var(--bg); }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-dark); }

/* Report Card Wrapper */
.rc-wrapper {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow);
  max-width: 1060px; margin: 0 auto 32px; overflow: hidden;
}

/* School Header - Professional Print Style */
.school-header-wrap {
  text-align: center; padding: 40px 20px 20px; background: white; position: relative;
}
.school-logo {
  width: 90px; height: auto; margin-bottom: 12px;
}
.school-name {
  font-size: 32px; font-weight: 800; color: #0b7b3f; /* Deep Green */
  letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 4px;
}
.school-motto {
  font-size: 14px; color: #d97706; /* Golden Yellow */
  font-weight: 600; font-style: italic; letter-spacing: 1px;
}

/* Green curve block */
.curved-bg {
  background: #0b7b3f;
  padding: 30px 20px 60px;
  position: relative;
  text-align: center;
  color: white;
  border-top: 10px solid #fbbf24;
  border-top-left-radius: 100% 30px;
  border-top-right-radius: 100% 30px;
  margin-top: -15px;
}

.report-badge {
  display: inline-block; padding: 8px 32px;
  background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
  border-radius: 30px; font-size: 14px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
}
.report-badge {
  display: inline-block; margin-top: 12px; padding: 4px 20px;
  background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4);
  border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
}

/* Student Info Row (Overlaid on green) */
.student-info-row {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0;
  background: #ffffff;
  border: 1px solid #0b7b3f;
  border-radius: 16px;
  margin: -40px 32px 24px; /* Pull up over the green background */
  position: relative;
  z-index: 10;
  box-shadow: 0 8px 24px rgba(0,0,0,0.1);
}
.info-cell { padding: 16px 24px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.info-cell:nth-child(3n) { border-right: none; }
.info-cell:nth-child(n+4) { border-bottom: none; }
.info-label { font-weight: 600; color: var(--text-muted); margin-bottom: 4px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
.info-val { font-weight: 700; color: #0b7b3f; font-size: 14px; }

/* Main Report Table */
.rc-body { padding: 20px 24px; }
.rc-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }

table.rc-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.rc-table th, .rc-table td {
  border: 1px solid #dde1e7; padding: 7px 6px; text-align: center; vertical-align: middle;
}
.rc-table thead th { background: #f1f5f9; font-weight: 700; color: var(--text-muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.3px; }
.rc-table td.sub-name { text-align: left; font-weight: 600; color: var(--text); padding-left: 12px; white-space: nowrap; }
.rc-table tr.total-row td { background: #f8fafc; font-weight: 700; }
.rc-table tr.total-row td.sub-name { color: var(--primary); }

/* Grade colouring - Toned down for professional look */
.grade-O, .grade-Ap, .grade-A, .grade-Bp, .grade-B, .grade-C { color: #1e293b; font-weight: 700; }
.grade-F   { color: #dc2626; font-weight: 700; }

/* Term group header - Uniform sophisticated color */
.term-header, .term2-header, .final-header, .personality-header { 
  background: #0f4a2d !important; /* Unified dark green */
  color: white !important; 
  font-size: 10px !important; 
  letter-spacing: 1px; 
}

/* Bottom Section */
.rc-bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }

/* Attendance Card */
.att-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.att-card h4 { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.att-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #f1f5f9; font-size: 12.5px; }
.att-row:last-child { border-bottom: none; }
.att-bar-wrap { flex: 1; margin: 0 12px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.att-bar-fill { height: 100%; border-radius: 3px; }

/* Remarks */
.remarks-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.remarks-card h4 { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
.remark-row { font-size: 12.5px; padding: 6px 0; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; }
.remark-row:last-child { border-bottom: none; }

/* Result Banner */
.result-banner {
  margin-top: 20px; padding: 14px 20px; border-radius: var(--radius);
  display: flex; align-items: center; justify-content: space-between;
}
.result-banner.pass { background: #ecfdf5; border: 1px solid #a7f3d0; }
.result-banner.fail { background: #fef2f2; border: 1px solid #fca5a5; }
.result-banner.supp { background: #fffbeb; border: 1px solid #fde68a; }
.result-text { font-weight: 700; font-size: 14px; }
.result-text.pass { color: #059669; }
.result-text.fail { color: #dc2626; }
.result-text.supp { color: #d97706; }
.result-grade { font-size: 28px; font-weight: 800; }

/* Signatures */
.sig-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 24px; padding-top: 20px; border-top: 1px dashed var(--border); }
.sig-box { text-align: center; }
.sig-line { border-bottom: 1px solid var(--text-hint); height: 36px; margin-bottom: 6px; }
.sig-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

/* Error */
.error-card { text-align: center; padding: 48px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); max-width: 500px; margin: 40px auto; }

/* Print */
@media print {
  @page { margin: 15mm; size: A4; }
  body { background: white; height: auto; overflow: visible; }
  .main { overflow: visible; }
  .topbar, .page-header, .page-actions { display: none !important; }
  .content { padding: 0 !important; overflow: visible !important; }
  .rc-wrapper { border: none !important; box-shadow: none !important; border-radius: 0 !important; max-width: 100% !important; margin: 0 !important; }
  .school-header-wrap, .curved-bg, .report-badge, .student-info-row { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  .term-header, .term2-header, .final-header, .personality-header { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  .result-banner { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  .student-info-row { box-shadow: none !important; }
}
.sidebar a,.sidebar a:link,.sidebar a:visited,.sidebar a:hover,.sidebar a:active{text-decoration:none!important;color:inherit;}
</style>

<script>
// =====================================================================

const SCHOOL = {

  affiliation: 'Affiliated to CBSE Board | Affil. No: 1234567 | School Code: 98765',
  address: 'BodhyaMarg Campus, Delhi NCR',

};

// Subjects in the marksheet
const SUBJECTS = [
  { id: 'eng',  name: 'Special English',    maxF: 25,  maxS: 90 },
  { id: 'hin',  name: 'General Hindi',       maxF: 25,  maxS: 90 },
  { id: 'mat',  name: 'Mathematics',         maxF: 25,  maxS: 90 },
  { id: 'sci',  name: 'Science + Project',   maxF: 25,  maxS: 90 },
  { id: 'sst',  name: 'Social Science',      maxF: 25,  maxS: 90 },
  { id: 'san',  name: 'Sanskrit',            maxF: 25,  maxS: 90 },
  { id: 'com',  name: 'Computer',            maxF: 25,  maxS: 90 },
  { id: 'gk',   name: 'General Knowledge',   maxF: 25,  maxS: 90 },

// Personality assessment traits
const PERSONALITY = [
  'Attitude Towards Teachers',
  'Attitude Towards School Mates',
  'Attitude Towards School Activities',
  'Attitude Towards Entertainment',
  'Regularity & Punctuality',
  'Courteousness',
  'Discipline',
  'Neatness',
  'Scientific Skills',
];

const GRADE_LABELS = { 5:'A+', 4:'A', 3:'B+', 2:'B', 1:'C', 0:'D' };

// =====================================================================
// MOCK DATA — replace with DB fetch in production
// =====================================================================
const STUDENTS = [
  {
    name: 'Aarav Sharma', roll: 'X-A-01', cls: 'Class VIII - A',
    admissionNo: 'ADM2021001', dob: '12-Mar-2010', fatherName: 'Rajesh Sharma',
    // F1, F2, S1, F3, F4, S2 for each subject (marks out of maxF/maxS)
    marks: {
      eng: { f1:20, f2:22, s1:78, f3:21, f4:19, s2:80 },
      hin: { f1:18, f2:21, s1:72, f3:20, f4:22, s2:76 },

      san: { f1:15, f2:17, s1:60, f3:16, f4:18, s2:65 },
      com: { f1:23, f2:25, s1:82, f3:24, f4:23, s2:85 },
      gk:  { f1:20, f2:21, s1:75, f3:19, f4:22, s2:78 },
    },
    attendance: { working: 220, present: 198 },
    personality: [4, 4, 3, 4, 5, 4, 4, 3, 4],
    remarks: { s1: 'Satisfactory Performance', s2: 'Satisfactory Performance' }
  },
  {
    name: 'Diya Patel', roll: 'X-A-02', cls: 'Class VIII - A',
    admissionNo: 'ADM2021002', dob: '05-Jul-2010', fatherName: 'Nilesh Patel',
    marks: {
      eng: { f1:14, f2:16, s1:50, f3:15, f4:17, s2:55 },
      hin: { f1:18, f2:15, s1:60, f3:16, f4:18, s2:62 },
      mat: { f1:10, f2:12, s1:35, f3:11, f4:13, s2:38 },
      sci: { f1:16, f2:18, s1:55, f3:17, f4:16, s2:58 },
      sst: { f1:20, f2:19, s1:65, f3:18, f4:20, s2:68 },
      san: { f1:12, f2:14, s1:45, f3:13, f4:15, s2:48 },
      com: { f1:20, f2:22, s1:72, f3:21, f4:20, s2:75 },
      gk:  { f1:18, f2:17, s1:60, f3:16, f4:19, s2:63 },
    },
    attendance: { working: 220, present: 172 },
    personality: [3, 3, 3, 3, 2, 3, 3, 3, 3],
    remarks: { s1: 'Needs Improvement', s2: 'Needs Improvement' }
  },
  {
    name: 'Ishaan Verma', roll: 'X-A-03', cls: 'Class VIII - A',
    admissionNo: 'ADM2021003', dob: '22-Nov-2010', fatherName: 'Suresh Verma',
    marks: {
      eng: { f1:8,  f2:10, s1:28, f3:9,  f4:11, s2:30 },
      hin: { f1:12, f2:11, s1:40, f3:10, f4:12, s2:42 },
      mat: { f1:6,  f2:8,  s1:22, f3:7,  f4:9,  s2:25 },
      sci: { f1:10, f2:9,  s1:32, f3:11, f4:10, s2:35 },
      sst: { f1:14, f2:13, s1:45, f3:12, f4:14, s2:48 },
      san: { f1:7,  f2:8,  s1:25, f3:8,  f4:9,  s2:28 },
      com: { f1:15, f2:16, s1:52, f3:14, f4:15, s2:55 },
      gk:  { f1:11, f2:10, s1:38, f3:10, f4:12, s2:40 },
    },
    attendance: { working: 220, present: 145 },
    personality: [2, 2, 2, 3, 1, 2, 2, 2, 2],
    remarks: { s1: 'Very Poor Performance', s2: 'Very Poor Performance' }
  },
];

// =====================================================================
// CALCULATION ENGINE
// =====================================================================
function gradeFromPct(pct) {
  if (pct >= 90) return { g: 'O',  css: 'grade-O' };
  if (pct >= 80) return { g: 'A+', css: 'grade-Ap' };
  if (pct >= 70) return { g: 'A',  css: 'grade-A' };
  if (pct >= 60) return { g: 'B+', css: 'grade-Bp' };
  if (pct >= 50) return { g: 'B',  css: 'grade-B' };
  if (pct >= 33) return { g: 'C',  css: 'grade-C' };
  return { g: 'F', css: 'grade-F' };
}

function gradeFromMark(mark, max) {
  return gradeFromPct((mark / max) * 100);
}

function processStudent(student) {
  const rows = [];
  let totalS1 = 0, totalS2 = 0, totalFinal = 0;
  let totalMaxS1 = 0, totalMaxS2 = 0, totalMaxFinal = 0;
  let anyFail = false;

  SUBJECTS.forEach(sub => {
    const m = student.marks[sub.id] || {};
    const f1 = m.f1 || 0, f2 = m.f2 || 0;
    const f3 = m.f3 || 0, f4 = m.f4 || 0;
    const s1 = m.s1 || 0, s2 = m.s2 || 0;

    const maxF = sub.maxF, maxS = sub.maxS;

    // S1 total = best of (F1+F2) + S1 exam
    const termISub = f1 + f2 + s1;
    const maxTermI  = maxF + maxF + maxS;

    // S2 total = best of (F3+F4) + S2 exam
    const termIISub = f3 + f4 + s2;
    const maxTermII = maxF + maxF + maxS;

    // Final = 20% of S1-exam + 80% of S2-exam
    const finalMark = Math.round((s1 * 0.20) + (s2 * 0.80));
    const maxFinal  = Math.round((maxS * 0.20) + (maxS * 0.80));

    const gf1   = gradeFromMark(f1, maxF);
    const gf2   = gradeFromMark(f2, maxF);
    const gs1   = gradeFromMark(s1, maxS);
    const gf3   = gradeFromMark(f3, maxF);
    const gf4   = gradeFromMark(f4, maxF);
    const gs2   = gradeFromMark(s2, maxS);
    const gFin  = gradeFromMark(finalMark, maxFinal);

    if (gFin.g === 'F') anyFail = true;

    totalS1    += termISub;  totalMaxS1  += maxTermI;
    totalS2    += termIISub; totalMaxS2  += maxTermII;
    totalFinal += finalMark; totalMaxFinal += maxFinal;

    rows.push({ sub, f1, gf1, f2, gf2, s1, gs1, f3, gf3, f4, gf4, s2, gs2, finalMark, gFin });
  });

  const pctS1  = ((totalS1  / totalMaxS1)  * 100).toFixed(1);
  const pctS2  = ((totalS2  / totalMaxS2)  * 100).toFixed(1);
  const pctFin = ((totalFinal / totalMaxFinal) * 100).toFixed(1);
  const finalGrade = gradeFromPct(parseFloat(pctFin));

  return {
    rows, totalS1, totalMaxS1, totalS2, totalMaxS2,
    totalFinal, totalMaxFinal, pctS1, pctS2, pctFin,
    finalGrade, anyFail
  };
}

// =====================================================================
// RENDER
// =====================================================================
function mkCell(mark, gradeObj) {
  return `<td>${mark}</td><td class="${gradeObj.css}">${gradeObj.g}</td>`;
}

function renderReportCard() {
  const params = new URLSearchParams(window.location.search);
  const rollNo = params.get('roll') || 'X-A-01';

  const student = STUDENTS.find(s => s.roll === rollNo) || STUDENTS[0];
  const calc = processStudent(student);
  const att = student.attendance;
  const attPct = ((att.present / att.working) * 100).toFixed(1);
  const attColor = attPct >= 90 ? '#059669' : attPct >= 75 ? '#d97706' : '#dc2626';
  const resultClass = calc.anyFail ? 'fail' : 'pass';
  const resultText  = calc.anyFail ? 'FAILED' : 'PROMOTED';

  // Subject rows
  let subjectRows = '';
  calc.rows.forEach(r => {
    subjectRows += `
      <tr>
        <td class="sub-name">${r.sub.name}</td>
        ${mkCell(r.f1, r.gf1)}
        ${mkCell(r.f2, r.gf2)}
        ${mkCell(r.s1, r.gs1)}
        ${mkCell(r.f3, r.gf3)}
        ${mkCell(r.f4, r.gf4)}
        ${mkCell(r.s2, r.gs2)}
        <td class="${r.gFin.css}" style="font-weight:700;">${r.finalMark}</td>
        <td class="${r.gFin.css}">${r.gFin.g}</td>
      </tr>`;
  });

  // Total row
  const gTotal = gradeFromPct(parseFloat(calc.pctFin));
  subjectRows += `
    <tr class="total-row">
      <td class="sub-name">TOTAL MARKS</td>
      <td colspan="2">—</td>
      <td colspan="2">—</td>
      <td style="font-weight:700;">${calc.totalS1}</td>
      <td colspan="2">—</td>
      <td colspan="2">—</td>
      <td style="font-weight:700;">${calc.totalS2}</td>
      <td style="font-weight:700;" class="${gTotal.css}">${calc.totalFinal}</td>
      <td class="${gTotal.css}">${gTotal.g}</td>
    </tr>
    <tr class="total-row">
      <td class="sub-name">Percentage</td>
      <td colspan="5" style="font-weight:700;">${calc.pctS1}%</td>
      <td colspan="5" style="font-weight:700;">${calc.pctS2}%</td>
      <td colspan="2" style="font-weight:700;" class="${gTotal.css}">${calc.pctFin}%</td>
    </tr>`;

  // Personality rows
  let persRows = '';
  PERSONALITY.forEach((trait, i) => {
    const grade = GRADE_LABELS[student.personality[i]] || 'B';
    persRows += `
      <tr>
        <td style="text-align:left; padding-left:10px; font-size:11px;">${trait}</td>
        <td style="font-weight:700; color:#7c2d12;">${grade}</td>
      </tr>`;
  });

  const container = document.getElementById('reportContainer');
  container.innerHTML = `
  <div class="rc-wrapper">

    <!-- School Header -->
    <div class="school-header-wrap">
      <img src="school_logo.png" class="school-logo" alt="Logo" onerror="this.src='https://via.placeholder.com/90x100?text=Logo'">
      <div class="school-name">${SCHOOL.name}</div>
      <div class="school-motto">passion to excel</div>
    </div>
    
    <div class="curved-bg">
      <div class="report-badge">Achievement Record &nbsp;|&nbsp; Session ${SCHOOL.session}</div>
    </div>

    <!-- Student Info Strip -->
    <div class="student-info-row">
      <div class="info-cell">
        <div class="info-label">Student Name</div>
        <div class="info-val">${student.name}</div>
      </div>
      <div class="info-cell">
        <div class="info-label">Admission No</div>
        <div class="info-val">${student.admissionNo}</div>
      </div>
      <div class="info-cell">
        <div class="info-label">Class & Section</div>
        <div class="info-val">${student.cls}</div>
      </div>
      <div class="info-cell">
        <div class="info-label">Roll No</div>
        <div class="info-val">${student.roll}</div>
      </div>
      <div class="info-cell">
        <div class="info-label">Date of Birth</div>
        <div class="info-val">${student.dob}</div>
      </div>
      <div class="info-cell" style="border-bottom:none;">
        <div class="info-label">Father's Name</div>
        <div class="info-val">${student.fatherName}</div>
      </div>
    </div>

    <!-- Main Report Table -->
    <div class="rc-body">
      <div class="rc-table-wrap">
        <table class="rc-table">
          <thead>
            <tr>
              <th rowspan="3" style="text-align:left; padding-left:12px; min-width:140px;">SUBJECTS</th>
              <th colspan="5" class="term-header">TERM - I</th>
              <th colspan="6" class="term2-header">TERM - II</th>
              <th colspan="2" class="final-header">FINAL</th>
              <th colspan="2" class="personality-header">PERSONALITY<br>ASSESSMENT</th>
            </tr>
            <tr>
              <th class="term-header" colspan="2">F1</th>
              <th class="term-header" colspan="2">F2</th>
              <th class="term-header">S1</th>
              <th class="term2-header" colspan="2">F3</th>
              <th class="term2-header" colspan="2">F4</th>
              <th class="term2-header" colspan="2">S2</th>
              <th class="final-header" style="font-size:9px;">S1+S2<br>20%+80%</th>
              <th class="final-header">Grd</th>
              <th class="personality-header">Trait</th>
              <th class="personality-header">Grade</th>
            </tr>
            <tr>
              <th class="term-header">Mk</th><th class="term-header">Grd</th>
              <th class="term-header">Mk</th><th class="term-header">Grd</th>
              <th class="term-header">Mk</th>
              <th class="term2-header">Mk</th><th class="term2-header">Grd</th>
              <th class="term2-header">Mk</th><th class="term2-header">Grd</th>
              <th class="term2-header">Mk</th><th class="term2-header">Grd</th>
              <th class="final-header">Mk</th>
              <th class="final-header">Grd</th>
              <th class="personality-header" colspan="2"></th>
            </tr>
          </thead>
          <tbody id="subjectTableBody">
            ${(() => {
              // Merge subject rows with personality rows
              const sRows = calc.rows;
              let html = '';
              sRows.forEach((r, i) => {
                const hasPers = i < PERSONALITY.length;
                const persLabel = hasPers ? PERSONALITY[i] : '';
                const persGrade = hasPers ? (GRADE_LABELS[student.personality[i]] || 'B') : '';
                html += `
                  <tr>
                    <td class="sub-name">${r.sub.name}</td>
                    ${mkCell(r.f1, r.gf1)}
                    ${mkCell(r.f2, r.gf2)}
                    <td>${r.s1}</td>
                    ${mkCell(r.f3, r.gf3)}
                    ${mkCell(r.f4, r.gf4)}
                    <td>${r.s2}</td>
                    <td class="${r.gFin.css}" style="font-weight:700;">${r.finalMark}</td>
                    <td class="${r.gFin.css}">${r.gFin.g}</td>
                    <td style="text-align:left; font-size:11px; padding:4px 6px; max-width:130px;">${persLabel}</td>
                    <td style="font-weight:700; color:#7c2d12;">${persGrade}</td>
                  </tr>`;
              });
              // Extra personality rows that exceed subject count
              for (let i = sRows.length; i < PERSONALITY.length; i++) {
                const persGrade = GRADE_LABELS[student.personality[i]] || 'B';
                html += `
                  <tr>
                    <td class="sub-name"></td>
                    <td colspan="12"></td>
                    <td style="text-align:left; font-size:11px; padding:4px 6px;">${PERSONALITY[i]}</td>
                    <td style="font-weight:700; color:#7c2d12;">${persGrade}</td>
                  </tr>`;
              }
              return html;
            })()}
            <!-- Total + Pct rows -->
            <tr class="total-row">
              <td class="sub-name">TOTAL MARKS</td>
              <td colspan="4" style="font-size:11px; color:var(--text-muted);">—</td>
              <td style="font-weight:700;">${calc.totalS1}</td>
              <td colspan="5" style="font-size:11px; color:var(--text-muted);">—</td>
              <td style="font-weight:700;">${calc.totalS2}</td>
              <td style="font-weight:700;" class="${gTotal.css}">${calc.totalFinal}</td>
              <td class="${gTotal.css}">${gTotal.g}</td>
              <td colspan="2"></td>
            </tr>
            <tr class="total-row">
              <td class="sub-name">Percentage</td>
              <td colspan="5" style="font-weight:700; font-size:12px;">${calc.pctS1}%</td>
              <td colspan="6" style="font-weight:700; font-size:12px;">${calc.pctS2}%</td>
              <td colspan="2" style="font-weight:700; font-size:13px;" class="${gTotal.css}">${calc.pctFin}%</td>
              <td colspan="2"></td>
            </tr>
            <tr class="total-row">
              <td class="sub-name">Result</td>
              <td colspan="5">
                <span style="font-weight:700; color:${resultClass==='pass'?'#059669':'#dc2626'}; font-size:12px;">${resultText}</span>
              </td>
              <td colspan="6"></td>
              <td colspan="2" style="font-weight:700; font-size:14px; color:${resultClass==='pass'?'#059669':'#dc2626'};">${calc.finalGrade.g}</td>
              <td colspan="2" style="font-size:11px; font-weight:600; color:#7c2d12;">Final Grade</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Bottom: Attendance + Remarks -->
      <div class="rc-bottom">

        <div>
          <!-- Attendance -->
          <div class="att-card" style="margin-bottom:16px;">
            <h4><i class="ti ti-calendar-check" style="color:var(--primary);"></i> Attendance Summary</h4>
            <div class="att-row">
              <span style="color:var(--text-muted); font-size:12px;">Total Working Days</span>
              <strong>${att.working}</strong>
            </div>
            <div class="att-row">
              <span style="color:var(--text-muted); font-size:12px;">Days Attended</span>
              <strong>${att.present}</strong>
            </div>
            <div class="att-row">
              <span style="color:var(--text-muted); font-size:12px;">Attendance %</span>
              <div style="display:flex; align-items:center; gap:8px;">
                <div class="att-bar-wrap">
                  <div class="att-bar-fill" style="width:${attPct}%; background:${attColor};"></div>
                </div>
                <strong style="color:${attColor};">${attPct}%</strong>
              </div>
            </div>
          </div>

          <!-- Grade Scale -->
          <div class="att-card">
            <h4><i class="ti ti-ruler" style="color:var(--primary);"></i> Grade Scale</h4>
            <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:6px; font-size:11px;">
              <div style="text-align:center; padding:6px; background:#ecfdf5; border-radius:6px;"><strong class="grade-O">O</strong><br><span style="color:var(--text-muted);">90-100%</span></div>
              <div style="text-align:center; padding:6px; background:#dbeafe; border-radius:6px;"><strong class="grade-Ap">A+</strong><br><span style="color:var(--text-muted);">80-89%</span></div>
              <div style="text-align:center; padding:6px; background:#e0e7ff; border-radius:6px;"><strong class="grade-A">A</strong><br><span style="color:var(--text-muted);">70-79%</span></div>
              <div style="text-align:center; padding:6px; background:#f5f3ff; border-radius:6px;"><strong class="grade-Bp">B+</strong><br><span style="color:var(--text-muted);">60-69%</span></div>
              <div style="text-align:center; padding:6px; background:#fffbeb; border-radius:6px;"><strong class="grade-B">B</strong><br><span style="color:var(--text-muted);">50-59%</span></div>
              <div style="text-align:center; padding:6px; background:#fff7ed; border-radius:6px;"><strong class="grade-C">C</strong><br><span style="color:var(--text-muted);">33-49%</span></div>
              <div style="text-align:center; padding:6px; background:#fef2f2; border-radius:6px; grid-column:span 2;"><strong class="grade-F">F</strong><br><span style="color:var(--text-muted);">Below 33%</span></div>
            </div>
          </div>
        </div>

        <div>
          <!-- Remarks -->
          <div class="remarks-card" style="margin-bottom:16px;">
            <h4><i class="ti ti-message-2" style="color:var(--primary);"></i> Teacher's Remarks</h4>
            <div class="remark-row">
              <span style="color:var(--text-muted); font-size:12px;">1st Summative (Term I)</span>
              <span style="font-weight:600; font-size:12px;">${student.remarks.s1}</span>
            </div>
            <div class="remark-row">
              <span style="color:var(--text-muted); font-size:12px;">2nd Summative (Term II)</span>
              <span style="font-weight:600; font-size:12px;">${student.remarks.s2}</span>
            </div>
          </div>

          <!-- Result Banner -->
          <div class="result-banner ${resultClass}">
            <div>
              <div style="font-size:11px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px;">Final Result</div>
              <div class="result-text ${resultClass}">${resultText}</div>
              <div style="font-size:11.5px; color:var(--text-muted); margin-top:4px;">
                ${resultClass==='pass'
                  ? `Promoted to next grade with <strong>${calc.pctFin}%</strong>`
                  : `Did not qualify for promotion. Percentage: <strong>${calc.pctFin}%</strong>`}
              </div>
            </div>
            <div class="result-grade" style="color:${resultClass==='pass'?'#059669':'#dc2626'};">${gTotal.g}</div>
          </div>
        </div>
      </div>

      <!-- Signatures -->
      <div class="sig-row">
        <div class="sig-box">
          <div class="sig-line"></div>
          <div class="sig-label">Class Teacher's Signature</div>
        </div>
        <div class="sig-box">
          <div class="sig-line"></div>
          <div class="sig-label">Parent's Signature</div>
        </div>
        <div class="sig-box">
          <div class="sig-line"></div>
          <div class="sig-label">Principal's Signature</div>
        </div>
      </div>

    </div><!-- rc-body -->
  </div><!-- rc-wrapper -->
  `;
}

// =====================================================================
const gTotal = gradeFromPct(0); // placeholder — overridden at render time
document.addEventListener('DOMContentLoaded', renderReportCard);
</script>
<script src="sidebar.js"></script>
</body>
</html>
